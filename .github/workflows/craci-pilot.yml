        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
