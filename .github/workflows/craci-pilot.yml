    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned MuJoCo wheels and base R
      run: |
        set -euo pipefail
        # The runner's unrelated Microsoft apt feed is blocked (HTTP 403).
        # Install only from Ubuntu's signed OS repos, covered by the ubuntu network preset.
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        test -f "$ubuntu_sources"
        sudo apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- update -qq
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- install -y --no-install-recommends r-base-core libdigest-sha-perl python3-venv
