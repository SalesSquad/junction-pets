        "$RUNNER_TEMP/rokoko-venv/bin/python" -m pip install --only-binary=:all: --no-cache-dir mujoco==3.3.7 numpy==2.4.6
        "$RUNNER_TEMP/rokoko-venv/bin/python" -c 'import mujoco,numpy; assert mujoco.__version__=="3.3.7"; assert numpy.__version__=="2.4.6"'
