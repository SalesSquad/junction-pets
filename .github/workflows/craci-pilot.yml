      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run actual unchanged DDL, temporal comparisons and restart durability
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: ${{ env.PRODUCT_SOURCE_SHA }}
        run: |
          set -euo pipefail
          git -C harness rev-parse HEAD
          export CRACI_MARIADB_OUTPUT="$RUNNER_TEMP/craci-mariadb-results"
          python3 harness/scripts/craci/mariadb-runtime.py
