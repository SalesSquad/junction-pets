      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_LEARNER_SEED: ${{ matrix.learner_seed }}
      CRACI_WORKLOAD: rokoko-rl-seed-sweep
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
    steps:
    - name: Configure 8-vCPU source-bound CRACI training
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '8'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, pypi, ubuntu]
          connections:
            - tls:
                serverNamePatterns:
                  - download.pytorch.org
                  - download-r2.pytorch.org
                ports: [443]
    - name: Enforce credit cutoff before package downloads
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install pinned CPU PyTorch and MuJoCo from official package registries
      run: |
        set -euo pipefail
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        test -f "$ubuntu_sources"
        sudo apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- update -qq
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- install -y --no-install-recommends python3-venv
