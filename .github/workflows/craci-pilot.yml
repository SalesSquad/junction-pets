    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'tieto-sponsor' }}
    name: Tieto MessagePack / ${{ matrix.revision }} / ${{ inputs.tieto_toolchain }}
    runs-on: craci
    timeout-minutes: 30
    concurrency:
      group: craci-tieto-${{ matrix.revision }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SPONSOR_SHA: ${{ matrix.source_sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TIETO_TOOLCHAIN: ${{ inputs.tieto_toolchain || 'pinned' }}
      PRODUCT_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/sponsor
      CRACI_SOURCE_REPOSITORY: te-industry-tech-office/junction26-messagepack-csharp
      CRACI_WORKLOAD: tieto-sponsor
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: ${{ inputs.tieto_toolchain == 'compatible' && '["global.json"]' || '[]' }}
    steps:
    - name: Configure public sponsor and SDK downloads
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '8'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, ubuntu]
          sources:
            - apt:
                urls: [https://packages.microsoft.com/ubuntu/24.04/prod]
          connections:
            - tls:
                serverNamePatterns:
                  - builds.dotnet.microsoft.com
                  - ci.dot.net
                  - dotnetcli.azureedge.net
                  - dotnetcli.blob.core.windows.net
                  - api.nuget.org
                  - globalcdn.nuget.org
                  - pkgs.dev.azure.com
                  - dnceng.pkgs.visualstudio.com
                ports: [443]
    - name: Enforce deadline and initialize bounded evidence
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - name: Check out the pinned campaign harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out official sponsor history for versioning
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: te-industry-tech-office/junction26-messagepack-csharp
        path: sponsor
        ref: ${{ matrix.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install the sponsor-pinned .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        global-json-file: sponsor/global.json
    - name: Install explicitly selected compatible compiler
      if: ${{ inputs.tieto_toolchain == 'compatible' }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 9.0.100
    - name: Restore the expected legacy timezone data
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y tzdata-legacy
        test -f /usr/share/zoneinfo/Cuba
    - name: Record the explicit compiler compatibility overlay
      if: ${{ inputs.tieto_toolchain == 'compatible' }}
      working-directory: sponsor
      run: |
        set -euo pipefail
        python3 ../harness/scripts/craci/tieto-toolchain.py
        git diff -- global.json
        test "$(git diff --name-only)" = "global.json"
    - name: Build and test four actual sponsor suites
      working-directory: sponsor
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/craci-qualification.sh" <<'CRACI_QUALIFICATION'
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SPONSOR_SHA"
        git rev-parse HEAD
        git -C ../harness rev-parse HEAD
        dotnet --version
        sha256sum global.json nuget.config LICENSE
        mkdir -p "$CRACI_RECEIPT_DIR/artifacts/tieto-results"
        result=0
        for suite in MessagePack.SourceGenerator.Tests MessagePack.SourceGenerator.ExecutionTests MessagePack.SourceGenerator.MapModeExecutionTests MessagePack.Tests; do
          if dotnet test "tests/$suite/$suite.csproj" -c Release -f net8.0 --logger "trx;LogFileName=$suite.trx" --results-directory "$CRACI_RECEIPT_DIR/artifacts/tieto-results" --blame-hang-timeout 3m; then
            printf 'SUITE_PASS %s\n' "$suite"
          else
            printf 'SUITE_FAIL %s\n' "$suite"
            result=1
          fi
        done
        python3 ../harness/scripts/craci/summarize-trx.py "$CRACI_RECEIPT_DIR/artifacts/tieto-results" "$SPONSOR_SHA"
        exit "$result"
        CRACI_QUALIFICATION
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash "$RUNNER_TEMP/craci-qualification.sh"
      id: qualification
    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
        receipt={'schemaVersion':1,'result':'incomplete','evidence':'infrastructure-only',
         'reason':'Pinned harness checkout unavailable; no qualification or registry import verified',
         'workload':env['CRACI_WORKLOAD'],'cell':env['CRACI_CELL'],
         'sourceRequested':env['CRACI_SOURCE_SHA'],'harnessRequested':env['CRACI_HARNESS_SHA'],
         'sourceVerified':False,'harnessVerified':False,'actualCostEur':None,
         'runId':env['GITHUB_RUN_ID'],'runAttempt':env['GITHUB_RUN_ATTEMPT']}
        with (out/'infrastructure-receipt.json').open('x') as file:json.dump(receipt,file,sort_keys=True)
        with open(env['GITHUB_OUTPUT'],'a') as file:file.write('upload_ready=true\n')
        CRACI_INFRA
          exit 1
        fi
