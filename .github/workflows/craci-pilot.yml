          scratch="$RUNNER_TEMP/meta-r-work"
          test ! -e "$scratch"
          mkdir "$scratch"
          if [ "$CRACI_WORKLOAD" = "meta-r-hardshift-2x" ]; then profile="hardshift24"; elif [ "$CRACI_WORKLOAD" = "meta-r-robust" ]; then profile="robust"; else profile="normal"; fi
          python3 "$CRACI_HARNESS_ROOT/scripts/craci/meta-r-generate.py" \
            --source-root "$CRACI_SOURCE_ROOT" \
