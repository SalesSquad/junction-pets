# Manual, useful qualification only. Ordinary PR and main commits do not fan out CI.
# Credit authorization ends 2026-11-15T17:00:00Z; existing stop automation remains authoritative.
# Source choices are resolved by scripts/craci/plan.mjs before matrix allocation.
# Explicit Docker CDN TLS remains outside package-aware detection; see the delivery report.
name: CRACI portable CI
run-name: CRACI ${{ inputs.workload }} / harness ${{ github.sha }}
'on':
  workflow_dispatch:
    inputs:
      workload:
        description: Fixed qualification workload
        type: choice
        default: portable
        options:
        - portable
        - product-browser
        - sbank-sponsor
        - portfolio-browser
        - sbank-properties
        - tieto-sponsor
        - council-postgres
        - meta-seeds
        - new-products-browser
        - native-probe
        - cache-proof
        - mariadb-runtime
        - meta-browser
        - meta-r-tournament
        - meta-r-robust
        - meta-r-hardshift-2x
        - lens-real-bop-train
        - lens-six-ml
        - lens-r8-meta
        - lens-r3-methods
        - lens-hb-vision
        - lens-hb-scene8-ood
      lane_slice:
        description: R8 only; pilot first, then seven unique remaining arms
        type: choice
        default: all
        options:
        - all
        - pilot
        - remaining
        - selection-repair
      source_sha:
        description: Full product SHA; overrides historical baseline. Tieto uses sponsor_revision.
        type: string
        default: ''
      product:
        description: Product for the browser workload
        type: choice
        default: stoa
        options:
        - stoa
        - valio
        - sbank
        - hostinger
        - espoo
        - exa
        - cala
        - context
        - all
      browser:
        description: Run all engines or only the engine needing qualification
        type: choice
        default: all
        options:
        - all
        - chromium
        - firefox
        - webkit
      sponsor_revision:
        description: Tieto sponsor canary or fixed five-commit matrix
        type: choice
        default: base
        options:
        - base
        - '2283'
        - '2234'
        - '2129'
        - '2297'
        - heads
        - all
      tieto_toolchain:
        description: Preserve pinned SDK or explicitly test Roslyn 4.12 compatibility
        type: choice
        default: pinned
        options:
        - pinned
        - compatible
      shard:
        description: Fixed scenario shard; use all only for new scenario coverage
        type: choice
        default: all
        options:
        - all
        - '0'
        - '1'
        - '2'
        - '3'
permissions:
  contents: read
env:
  CRACI_WINDOW_END: '2026-11-15T17:00:00Z'
concurrency:
  group: craci-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' }}
    name: Admit exact sources and bounded matrix
    runs-on: craci
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
    - name: Configure source-only planner
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '2'
        image: default
        network: |
          default: deny
          presets: [github]
    - name: Enforce the authorized credit deadline
      run: |
        set -euo pipefail
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
    - name: Check out immutable harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: plan
      name: Validate inputs before any matrix fan-out
      env:
        CRACI_INPUTS: ${{ toJSON(inputs) }}
        CRACI_CREDIT_WINDOW_OPEN: ${{ vars.CRACI_CREDIT_WINDOW_OPEN }}
      run: |
        set -euo pipefail
        test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
        node harness/scripts/craci/plan.mjs
    - name: Retain bounded evidence even after failure
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-plan/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false
  portable:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'portable' }}
    name: Validate, test and build on CRACI
    runs-on: craci
    timeout-minutes: 15
    steps:
    - name: Configure monitored CRACI networking
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '2'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, npm]
    - name: Enforce deadline and initialize bounded evidence
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - name: Check out immutable harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out the selected commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
        path: source
    - name: Set up Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Record source and executor
      env:
        SOURCE_SHA: ${{ matrix.source_sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        git rev-parse HEAD
        node --version
        npm --version
        uname -sm
      working-directory: source
    - name: Explicit portable milestone qualification
      working-directory: source
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/craci-qualification.sh" <<'CRACI_QUALIFICATION'
        set -euo pipefail
        npm ci --ignore-scripts
        npm audit --audit-level=high
        npm run validate
        npm test
        npm run build
        test -d dist/site
        find dist/site -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum -- > "$CRACI_RECEIPT_DIR/artifacts/build.sha256"
        test -s "$CRACI_RECEIPT_DIR/artifacts/build.sha256"
        sha256sum package-lock.json
        sha256sum "$CRACI_RECEIPT_DIR/artifacts/build.sha256"
        CRACI_QUALIFICATION
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash "$RUNNER_TEMP/craci-qualification.sh"
      id: qualification
    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
        receipt={'schemaVersion':1,'result':'incomplete','evidence':'infrastructure-only',
         'reason':'Pinned harness checkout unavailable; no qualification or registry import verified',
         'workload':env['CRACI_WORKLOAD'],'cell':env['CRACI_CELL'],
         'sourceRequested':env['CRACI_SOURCE_SHA'],'harnessRequested':env['CRACI_HARNESS_SHA'],
         'sourceVerified':False,'harnessVerified':False,'actualCostEur':None,
         'runId':env['GITHUB_RUN_ID'],'runAttempt':env['GITHUB_RUN_ATTEMPT']}
        with (out/'infrastructure-receipt.json').open('x') as file:json.dump(receipt,file,sort_keys=True)
        with open(env['GITHUB_OUTPUT'],'a') as file:file.write('upload_ready=true\n')
        CRACI_INFRA
          exit 1
        fi
    - name: Retain bounded evidence even after failure
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-${{ github.job }}-${{ env.CRACI_CELL }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false
    needs:
    - plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRODUCT_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_WORKLOAD: portable
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
  product-browser:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'product-browser' }}
    name: ${{ inputs.product }} / ${{ matrix.browser }} on CRACI
    runs-on: craci
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - name: Configure browser installation networking
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '4'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, npm, ubuntu]
          sources:
            - apt:
                urls:
                  - https://packages.microsoft.com/ubuntu/24.04/prod
          connections:
            - tls:
                serverNamePatterns:
                  - cdn.playwright.dev
                  - playwright.download.prss.microsoft.com
                  - storage.googleapis.com
                  - fwjydgxpttajiqpfmqtj.supabase.co
                ports: [443]
    - name: Enforce deadline and initialize bounded evidence
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - name: Check out the pinned harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out the pinned product
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - name: Set up Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install the locked harness and selected browser
      working-directory: harness
      env:
        BROWSER: ${{ matrix.browser }}
      run: |
        set -euo pipefail
        start=$(date +%s)
        npm ci --ignore-scripts
        installed=$(date +%s)
        npx --no-install playwright install --with-deps "$BROWSER"
        ready=$(date +%s)
        printf '{"dependencyInstallSeconds":%s,"browserInstallSeconds":%s,"browser":"%s"}\n' "$((installed-start))" "$((ready-installed))" "$BROWSER" > "$CRACI_RECEIPT_DIR/artifacts/setup-timing.json"
    - name: Fetch and verify the Stoa sponsor sample
      if: ${{ inputs.product == 'stoa' }}
      run: |
        set -euo pipefail
        node source/solutions/stoa-blueprint-studio/scripts/fetch-sponsor-sample.mjs "$RUNNER_TEMP/stoa-sponsor.dxf"
        printf 'STOA_SPONSOR_DXF=%s\n' "$RUNNER_TEMP/stoa-sponsor.dxf" >> "$GITHUB_ENV"
    - name: Exercise desktop and narrow product journeys
      working-directory: harness
      env:
        PRODUCT: ${{ inputs.product }}
        BROWSER: ${{ matrix.browser }}
        CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
        PRODUCT_SOURCE_ROOT: ${{ github.workspace }}/source
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/craci-qualification.sh" <<'CRACI_QUALIFICATION'
        set -euo pipefail
        export CRACI_BROWSER_OUTPUT="$CRACI_RECEIPT_DIR/artifacts/product-browser"
        node scripts/craci/product-browser.mjs "$PRODUCT" "$BROWSER"
        CRACI_QUALIFICATION
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash "$RUNNER_TEMP/craci-qualification.sh"
      id: qualification
    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
        receipt={'schemaVersion':1,'result':'incomplete','evidence':'infrastructure-only',
         'reason':'Pinned harness checkout unavailable; no qualification or registry import verified',
         'workload':env['CRACI_WORKLOAD'],'cell':env['CRACI_CELL'],
         'sourceRequested':env['CRACI_SOURCE_SHA'],'harnessRequested':env['CRACI_HARNESS_SHA'],
         'sourceVerified':False,'harnessVerified':False,'actualCostEur':None,
         'runId':env['GITHUB_RUN_ID'],'runAttempt':env['GITHUB_RUN_ATTEMPT']}
        with (out/'infrastructure-receipt.json').open('x') as file:json.dump(receipt,file,sort_keys=True)
        with open(env['GITHUB_OUTPUT'],'a') as file:file.write('upload_ready=true\n')
        CRACI_INFRA
          exit 1
        fi
    - name: Retain bounded evidence even after failure
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-${{ github.job }}-${{ env.CRACI_CELL }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false
    needs:
    - plan
    env:
      PRODUCT_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_WORKLOAD: product-browser
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
  sbank-sponsor:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'sbank-sponsor' }}
    name: S-Pankki official synthetic CSV import on CRACI
    runs-on: craci
    timeout-minutes: 15
    steps:
    - name: Configure GitHub source networking
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '2'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github]
          connections:
            - tls:
                serverNamePatterns: [github-cloud.githubusercontent.com]
                ports: [443]
    - name: Enforce deadline and initialize bounded evidence
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - name: Check out the pinned harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out the pinned S-Pankki implementation
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - name: Fetch the official pinned sponsor CSV through Git LFS
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: hackjunction/Junction-2026-S-pankki
        ref: fbdecdedf1a1f49dd641c2e6b9f2b62d0dc0cc8f
        path: sponsor
        lfs: true
        sparse-checkout: tx_junction_transactions.csv
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Set up Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Verify real CSV bytes, independent rows and refusal to overwrite
      env:
        CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/craci-qualification.sh" <<'CRACI_QUALIFICATION'
        set -euo pipefail
        git -C harness rev-parse HEAD
        git -C source rev-parse HEAD
        git -C sponsor rev-parse HEAD
        python3 harness/scripts/craci/sbank-sponsor-check.py --csv "$GITHUB_WORKSPACE/sponsor/tx_junction_transactions.csv" --source-root "$GITHUB_WORKSPACE/source" --output "$CRACI_RECEIPT_DIR/artifacts/sponsor-customer.json"
        CRACI_QUALIFICATION
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash "$RUNNER_TEMP/craci-qualification.sh"
      id: qualification
    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
        receipt={'schemaVersion':1,'result':'incomplete','evidence':'infrastructure-only',
         'reason':'Pinned harness checkout unavailable; no qualification or registry import verified',
         'workload':env['CRACI_WORKLOAD'],'cell':env['CRACI_CELL'],
         'sourceRequested':env['CRACI_SOURCE_SHA'],'harnessRequested':env['CRACI_HARNESS_SHA'],
         'sourceVerified':False,'harnessVerified':False,'actualCostEur':None,
         'runId':env['GITHUB_RUN_ID'],'runAttempt':env['GITHUB_RUN_ATTEMPT']}
        with (out/'infrastructure-receipt.json').open('x') as file:json.dump(receipt,file,sort_keys=True)
        with open(env['GITHUB_OUTPUT'],'a') as file:file.write('upload_ready=true\n')
        CRACI_INFRA
          exit 1
        fi
    - name: Retain bounded evidence even after failure
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-${{ github.job }}-${{ env.CRACI_CELL }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false
    needs:
    - plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PRODUCT_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_WORKLOAD: sbank-sponsor
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
  tieto-sponsor:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'tieto-sponsor' }}
    name: Tieto MessagePack / ${{ matrix.revision }} / ${{ inputs.tieto_toolchain }}
    runs-on: craci
    timeout-minutes: 30
    concurrency:
      group: craci-tieto-${{ matrix.revision }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SPONSOR_SHA: ${{ matrix.source_sha }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TIETO_TOOLCHAIN: ${{ inputs.tieto_toolchain || 'pinned' }}
      PRODUCT_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/sponsor
      CRACI_SOURCE_REPOSITORY: te-industry-tech-office/junction26-messagepack-csharp
      CRACI_WORKLOAD: tieto-sponsor
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: ${{ inputs.tieto_toolchain == 'compatible' && '["global.json"]' || '[]' }}
    steps:
    - name: Configure public sponsor and SDK downloads
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '8'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, ubuntu]
          sources:
            - apt:
                urls: [https://packages.microsoft.com/ubuntu/24.04/prod]
          connections:
            - tls:
                serverNamePatterns:
                  - builds.dotnet.microsoft.com
                  - ci.dot.net
                  - dotnetcli.azureedge.net
                  - dotnetcli.blob.core.windows.net
                  - api.nuget.org
                  - globalcdn.nuget.org
                  - pkgs.dev.azure.com
                  - dnceng.pkgs.visualstudio.com
                ports: [443]
    - name: Enforce deadline and initialize bounded evidence
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - name: Check out the pinned campaign harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out official sponsor history for versioning
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: te-industry-tech-office/junction26-messagepack-csharp
        path: sponsor
        ref: ${{ matrix.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install the sponsor-pinned .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        global-json-file: sponsor/global.json
    - name: Install explicitly selected compatible compiler
      if: ${{ inputs.tieto_toolchain == 'compatible' }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: 9.0.100
    - name: Restore the expected legacy timezone data
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y tzdata-legacy
        test -f /usr/share/zoneinfo/Cuba
    - name: Record the explicit compiler compatibility overlay
      if: ${{ inputs.tieto_toolchain == 'compatible' }}
      working-directory: sponsor
      run: |
        set -euo pipefail
        python3 ../harness/scripts/craci/tieto-toolchain.py
        git diff -- global.json
        test "$(git diff --name-only)" = "global.json"
    - name: Build and test four actual sponsor suites
      working-directory: sponsor
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/craci-qualification.sh" <<'CRACI_QUALIFICATION'
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SPONSOR_SHA"
        git rev-parse HEAD
        git -C ../harness rev-parse HEAD
        dotnet --version
        sha256sum global.json nuget.config LICENSE
        mkdir -p "$CRACI_RECEIPT_DIR/artifacts/tieto-results"
        result=0
        for suite in MessagePack.SourceGenerator.Tests MessagePack.SourceGenerator.ExecutionTests MessagePack.SourceGenerator.MapModeExecutionTests MessagePack.Tests; do
          if dotnet test "tests/$suite/$suite.csproj" -c Release -f net8.0 --logger "trx;LogFileName=$suite.trx" --results-directory "$CRACI_RECEIPT_DIR/artifacts/tieto-results" --blame-hang-timeout 3m; then
            printf 'SUITE_PASS %s\n' "$suite"
          else
            printf 'SUITE_FAIL %s\n' "$suite"
            result=1
          fi
        done
        python3 ../harness/scripts/craci/summarize-trx.py "$CRACI_RECEIPT_DIR/artifacts/tieto-results" "$SPONSOR_SHA"
        exit "$result"
        CRACI_QUALIFICATION
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash "$RUNNER_TEMP/craci-qualification.sh"
      id: qualification
    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
        receipt={'schemaVersion':1,'result':'incomplete','evidence':'infrastructure-only',
         'reason':'Pinned harness checkout unavailable; no qualification or registry import verified',
         'workload':env['CRACI_WORKLOAD'],'cell':env['CRACI_CELL'],
         'sourceRequested':env['CRACI_SOURCE_SHA'],'harnessRequested':env['CRACI_HARNESS_SHA'],
         'sourceVerified':False,'harnessVerified':False,'actualCostEur':None,
         'runId':env['GITHUB_RUN_ID'],'runAttempt':env['GITHUB_RUN_ATTEMPT']}
        with (out/'infrastructure-receipt.json').open('x') as file:json.dump(receipt,file,sort_keys=True)
        with open(env['GITHUB_OUTPUT'],'a') as file:file.write('upload_ready=true\n')
        CRACI_INFRA
          exit 1
        fi
