        with:
          size: '4'
          image: default
          network: |
            default: deny
            presets: [github, dockerhub]
            # Docker Hub's documented CDN; the initial trace denied this exact host.
            # Direct TLS permits the image download but is outside package detection.
            connections:
              - tls:
                  serverNamePatterns: [production.cloudfront.docker.com]
                  ports: [443]
      - name: Enforce credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
