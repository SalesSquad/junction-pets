        test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
        test "$(( $(date -ud "$CRACI_WINDOW_END" +%s) - $(date -u +%s) ))" -gt 1860 # 30m execution cap + 1m drain
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
