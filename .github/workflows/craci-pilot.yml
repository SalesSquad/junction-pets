          test -s "$scratch/dataset-receipt.json"
          test -s "$scratch/models/training-report.json"
          test -s "$scratch/models/trained-models.rds"
          dest="$CRACI_RECEIPT_DIR/artifacts/meta-r"
          mkdir -p "$dest"
          cp "$scratch/dataset-receipt.json" "$dest/dataset-receipt.json"
          cp "$scratch/models/training-report.json" "$dest/training-report.json"
          ( cd "$scratch" && python3 -m zipfile -c "$dest/training-evidence.zip" \
            dataset.csv dataset-receipt.json models/training-report.json models/trained-models.rds )
          test -s "$dest/training-evidence.zip"
          python3 -m zipfile -t "$dest/training-evidence.zip"
        '
    - id: receipt
