            - tls:
                serverNamePatterns: [huggingface.co, us.aws.cdn.hf.co, cas-bridge.xethub.hf.co, '*.xethub.hf.co', cdn-lfs.hf.co]
                ports: [443]
    - name: Enforce credit deadline and initialize receipt
      shell: bash
      run: |
        set -euo pipefail
        test "$(( $(date -ud "$CRACI_WINDOW_END" +%s) - $(date -u +%s) ))" -gt 1800
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install fixed public-data dependencies
      shell: bash
