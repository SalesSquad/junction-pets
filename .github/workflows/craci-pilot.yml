name: CRACI portable CI
run-name: CRACI ${{ inputs.workload || 'portable' }} ${{ inputs.workload == 'product-browser' && inputs.product || '' }} ${{ inputs.source_sha || github.sha }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workload:
        description: Fixed qualification workload
        type: choice
        default: portable
        options: [portable, product-browser, sbank-sponsor, portfolio-browser, sbank-properties, tieto-sponsor, council-postgres, meta-seeds, new-products-browser, native-probe, cache-proof, mariadb-runtime]
      source_sha:
        description: Full source commit; required for product browser and sponsor jobs
        type: string
        default: ''
      product:
        description: Product for the browser workload
        type: choice
        default: stoa
        options: [stoa, valio, sbank, hostinger, espoo, exa, cala, context, all]
      browser:
        description: Run all engines or only the engine needing qualification
        type: choice
        default: all
        options: [all, chromium, firefox, webkit]
      sponsor_revision:
        description: Tieto sponsor canary or fixed five-commit matrix
        type: choice
        default: base
        options: [base, '2283', '2234', '2129', '2297', heads, all]
      tieto_toolchain:
        description: Preserve pinned SDK or explicitly test Roslyn 4.12 compatibility
        type: choice
        default: pinned
        options: [pinned, compatible]
      shard:
        description: Fixed scenario shard; use all only for new scenario coverage
        type: choice
        default: all
        options: [all, '0', '1', '2', '3']

permissions:
  contents: read

env:
  # Conservative owner-authorized Junction window, not provider credit expiry.
  CRACI_WINDOW_END: '2026-11-15T17:00:00Z'

concurrency:
  group: craci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && (github.event_name != 'workflow_dispatch' || inputs.workload == 'portable') }}
    name: Validate, test and build on CRACI
    runs-on: craci
    timeout-minutes: 15
    steps:
      - name: Configure monitored CRACI networking
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534 # v1
        with:
          size: '2'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github, npm]
      - name: Enforce the credit window and source format
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          if [ -n "$SOURCE_SHA" ]; then [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
      - name: Check out the selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record source and executor
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          node --version
          npm --version
          uname -sm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate packages
        run: npm run validate
      - name: Run Node tests
        run: npm test
      - name: Build catalog
        run: npm run build
      - name: Record lockfile and build digests
        run: |
          set -euo pipefail
          test -d dist/site
          find dist/site -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum -- > "$RUNNER_TEMP/craci-build.sha256"
          test -s "$RUNNER_TEMP/craci-build.sha256"
          sha256sum package-lock.json
          cat "$RUNNER_TEMP/craci-build.sha256"
          sha256sum "$RUNNER_TEMP/craci-build.sha256"

  product-browser:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'product-browser' }}
    name: ${{ inputs.product }} / ${{ matrix.browser }} on CRACI
    runs-on: craci
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: ${{ fromJSON(inputs.browser == 'chromium' && '["chromium"]' || inputs.browser == 'firefox' && '["firefox"]' || inputs.browser == 'webkit' && '["webkit"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - name: Configure browser installation networking
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '4'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github, npm, ubuntu]
            sources:
              - apt:
                  urls:
                    - https://packages.microsoft.com/ubuntu/24.04/prod
            connections:
              - tls:
                  serverNamePatterns:
                    - cdn.playwright.dev
                    - playwright.download.prss.microsoft.com
                    - storage.googleapis.com
                    - fwjydgxpttajiqpfmqtj.supabase.co
                  ports: [443]
      - name: Enforce the credit window and immutable input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$PRODUCT" in stoa|valio) ;; *) exit 1;; esac
      - name: Check out the pinned harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the locked harness and selected browser
        working-directory: harness
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git -C ../source rev-parse HEAD
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps "$BROWSER"
      - name: Fetch and verify the Stoa sponsor sample
        if: ${{ inputs.product == 'stoa' }}
        run: |
          set -euo pipefail
          node source/solutions/stoa-blueprint-studio/scripts/fetch-sponsor-sample.mjs "$RUNNER_TEMP/stoa-sponsor.dxf"
          printf 'STOA_SPONSOR_DXF=%s\n' "$RUNNER_TEMP/stoa-sponsor.dxf" >> "$GITHUB_ENV"
      - name: Exercise desktop and narrow product journeys
        working-directory: harness
        env:
          PRODUCT: ${{ inputs.product }}
          BROWSER: ${{ matrix.browser }}
          CRACI_SOURCE_SHA: ${{ inputs.source_sha }}
          PRODUCT_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          set -euo pipefail
          export CRACI_BROWSER_OUTPUT="$RUNNER_TEMP/craci-browser-results"
          node scripts/craci/product-browser.mjs "$PRODUCT" "$BROWSER"

  sbank-sponsor:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'sbank-sponsor' }}
    name: S-Pankki official synthetic CSV import on CRACI
    runs-on: craci
    timeout-minutes: 15
    steps:
      - name: Configure GitHub source networking
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '2'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github]
            connections:
              - tls:
                  serverNamePatterns: [github-cloud.githubusercontent.com]
                  ports: [443]
      - name: Enforce the credit window and immutable input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the pinned harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the pinned S-Pankki implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Fetch the official pinned sponsor CSV through Git LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hackjunction/Junction-2026-S-pankki
          ref: fbdecdedf1a1f49dd641c2e6b9f2b62d0dc0cc8f
          path: sponsor
          lfs: true
          sparse-checkout: tx_junction_transactions.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify real CSV bytes, independent rows and refusal to overwrite
        env:
          CRACI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git -C harness rev-parse HEAD
          git -C source rev-parse HEAD
          git -C sponsor rev-parse HEAD
          python3 harness/scripts/craci/sbank-sponsor-check.py --csv "$GITHUB_WORKSPACE/sponsor/tx_junction_transactions.csv" --source-root "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/sponsor-customer.json"


  tieto-sponsor:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'tieto-sponsor' }}
    name: Tieto MessagePack / ${{ matrix.revision }} / ${{ inputs.tieto_toolchain }}
    runs-on: craci
    timeout-minutes: 30
    concurrency:
      group: craci-tieto-${{ matrix.revision }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        revision: ${{ fromJSON(inputs.sponsor_revision == 'all' && '["base","2283","2234","2129","2297"]' || inputs.sponsor_revision == 'heads' && '["2283","2234","2129","2297"]' || inputs.sponsor_revision == '2283' && '["2283"]' || inputs.sponsor_revision == '2234' && '["2234"]' || inputs.sponsor_revision == '2129' && '["2129"]' || inputs.sponsor_revision == '2297' && '["2297"]' || '["base"]') }}
    env:
      SPONSOR_SHA: ${{ fromJSON('{"base":"32258fdbee4bcd653c79f51b4376b5103c6f4d27","2283":"9df83c38409c8bfad0517aebffe48211eda4a5b4","2234":"9007cee1163c4a274fd60c3cc20c21ae63622786","2129":"083afd994c1c9a994cb2cd5aa0b6ad805a621457","2297":"a0aa5ab2de7f5a669d97e37184a89034c1de82b6"}')[matrix.revision] }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TIETO_TOOLCHAIN: ${{ inputs.tieto_toolchain || 'pinned' }}
    steps:
      - name: Configure public sponsor and SDK downloads
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '8'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github, ubuntu]
            sources:
              - apt:
                  urls: [https://packages.microsoft.com/ubuntu/24.04/prod]
            connections:
              - tls:
                  serverNamePatterns:
                    - builds.dotnet.microsoft.com
                    - ci.dot.net
                    - dotnetcli.azureedge.net
                    - dotnetcli.blob.core.windows.net
                    - api.nuget.org
                    - globalcdn.nuget.org
                    - pkgs.dev.azure.com
                    - dnceng.pkgs.visualstudio.com
                  ports: [443]
      - name: Enforce the credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          [[ "$SPONSOR_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the pinned campaign harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out official sponsor history for versioning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: te-industry-tech-office/junction26-messagepack-csharp
          path: sponsor
          ref: ${{ env.SPONSOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the sponsor-pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: sponsor/global.json
      - name: Install explicitly selected compatible compiler
        if: ${{ inputs.tieto_toolchain == 'compatible' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '9.0.100'
      - name: Restore the expected legacy timezone data
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tzdata-legacy
          test -f /usr/share/zoneinfo/Cuba
      - name: Record the explicit compiler compatibility overlay
        if: ${{ inputs.tieto_toolchain == 'compatible' }}
        working-directory: sponsor
        run: |
          set -euo pipefail
          python3 ../harness/scripts/craci/tieto-toolchain.py
          git diff -- global.json
          test "$(git diff --name-only)" = "global.json"
      - name: Build and test four actual sponsor suites
        working-directory: sponsor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SPONSOR_SHA"
          git rev-parse HEAD
          git -C ../harness rev-parse HEAD
          dotnet --version
          sha256sum global.json nuget.config LICENSE
          mkdir -p "$RUNNER_TEMP/tieto-results"
          result=0
          for suite in MessagePack.SourceGenerator.Tests MessagePack.SourceGenerator.ExecutionTests MessagePack.SourceGenerator.MapModeExecutionTests MessagePack.Tests; do
            if dotnet test "tests/$suite/$suite.csproj" -c Release -f net8.0 --logger "trx;LogFileName=$suite.trx" --results-directory "$RUNNER_TEMP/tieto-results" --blame-hang-timeout 3m; then
              printf 'SUITE_PASS %s\n' "$suite"
            else
              printf 'SUITE_FAIL %s\n' "$suite"
              result=1
            fi
          done
          python3 ../harness/scripts/craci/summarize-trx.py "$RUNNER_TEMP/tieto-results" "$SPONSOR_SHA"
          exit "$result"

  portfolio-browser:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'portfolio-browser' }}
    name: Portfolio ${{ matrix.product }} / ${{ matrix.browser }}
    runs-on: craci
    timeout-minutes: 20
    concurrency:
      group: craci-portfolio-browser-${{ matrix.product }}-${{ matrix.browser }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        product: ${{ fromJSON(inputs.product == 'sbank' && '["sbank"]' || inputs.product == 'hostinger' && '["hostinger"]' || inputs.product == 'espoo' && '["espoo"]' || inputs.product == 'exa' && '["exa"]' || '["sbank","hostinger","espoo","exa"]') }}
        browser: ${{ fromJSON(inputs.browser == 'chromium' && '["chromium"]' || inputs.browser == 'firefox' && '["firefox"]' || inputs.browser == 'webkit' && '["webkit"]' || '["chromium","firefox","webkit"]') }}
    env:
      PRODUCT_SOURCE_SHA: ${{ inputs.source_sha || fromJSON('{"sbank":"b2bb7f532fd496287aace73da98296306080df6c","hostinger":"23a029a48794ba275a0309584bf9968f7f5b665c","espoo":"ccd67d64f9a94952b0cd0f0ae1a6e2c8e8901a0a","exa":"2ce520f55a97f2491d34fb4582de728e7f379c1b"}')[matrix.product] }}
    steps:
      - name: Configure browser installation networking
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '4'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github, npm, ubuntu]
            sources:
              - apt:
                  urls: [https://packages.microsoft.com/ubuntu/24.04/prod]
            connections:
              - tls:
                  serverNamePatterns:
                    - cdn.playwright.dev
                    - playwright.download.prss.microsoft.com
                    - storage.googleapis.com
                  ports: [443]
      - name: Enforce window and unambiguous source selection
        env:
          SELECTED_PRODUCT: ${{ inputs.product }}
          SOURCE_OVERRIDE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          [[ "$PRODUCT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$SOURCE_OVERRIDE" ]; then
            case "$SELECTED_PRODUCT" in sbank|hostinger|espoo|exa) ;; *) exit 1;; esac
          fi
      - name: Check out the pinned harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the product's own PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the locked harness and selected browser
        working-directory: harness
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git -C ../source rev-parse HEAD
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps "$BROWSER"
      - name: Exercise consequential local product workflows
        working-directory: harness
        env:
          CRACI_PRODUCT: ${{ matrix.product }}
          CRACI_BROWSER: ${{ matrix.browser }}
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: ${{ env.PRODUCT_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export CRACI_BROWSER_OUTPUT="$RUNNER_TEMP/craci-portfolio-browser-results"
          node scripts/craci/portfolio-browser.mjs

  sbank-properties:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'sbank-properties' }}
    name: S-Pankki independent arithmetic / shard ${{ matrix.shard }}
    runs-on: craci
    timeout-minutes: 15
    concurrency:
      group: craci-sbank-properties-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shard == '0' && '[0]' || inputs.shard == '1' && '[1]' || inputs.shard == '2' && '[2]' || inputs.shard == '3' && '[3]' || '[0,1,2,3]') }}
    env:
      PRODUCT_SOURCE_SHA: ${{ inputs.source_sha || 'b2bb7f532fd496287aace73da98296306080df6c' }}
    steps:
      - name: Configure source-only networking
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '2'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github]
      - name: Enforce window and exact source
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          [[ "$PRODUCT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check 220002 independent cent and provenance properties
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: ${{ env.PRODUCT_SOURCE_SHA }}
          CRACI_SHARD: ${{ matrix.shard }}
          CRACI_CASES: '20000'
        run: |
          set -euo pipefail
          git -C harness rev-parse HEAD
          export CRACI_SEED="$((20261114 + CRACI_SHARD * 1000003))"
          node harness/scripts/craci/sbank-properties.mjs

  meta-seeds:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'meta-seeds' }}
    name: Meta synthetic model / seed shard ${{ matrix.shard }}
    runs-on: craci
    timeout-minutes: 20
    concurrency:
      group: craci-meta-seeds-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shard == '0' && '[0]' || inputs.shard == '1' && '[1]' || inputs.shard == '2' && '[2]' || inputs.shard == '3' && '[3]' || '[0,1,2,3]') }}
    steps:
      - name: Configure source-only model study
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '2'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github]
      - name: Enforce credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: '634f1e0e6cb2de46bcf0a783532d46c23f513d11'
          persist-credentials: false
      - name: Train and measure predeclared independent seeds
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: '634f1e0e6cb2de46bcf0a783532d46c23f513d11'
          CRACI_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          git -C harness rev-parse HEAD
          python3 --version
          python3 harness/scripts/craci/meta-seeds.py

  council-postgres:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'council-postgres' }}
    name: Council Python and real disposable PostgreSQL
    runs-on: craci
    timeout-minutes: 25
    concurrency:
      group: craci-council-postgres
      cancel-in-progress: false
    steps:
      - name: Configure existing Python and Ubuntu package sources
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '4'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github, pypi, ubuntu]
            sources:
              - apt:
                  urls: [https://packages.microsoft.com/ubuntu/24.04/prod]
      - name: Enforce credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: '672da2be99edff2fa25c0ab2703e6da88061a62f'
          persist-credentials: false
      - name: Install the existing pinned Council dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/council-venv"
          "$RUNNER_TEMP/council-venv/bin/python" -m pip install -r source/services/council/requirements-dev.txt
          "$RUNNER_TEMP/council-venv/bin/python" -m pip freeze
          if ! compgen -G '/usr/lib/postgresql/*/bin/initdb' > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
      - name: Run actual Python behavior and durable PostgreSQL replay
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: '672da2be99edff2fa25c0ab2703e6da88061a62f'
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git -C harness rev-parse HEAD
          "$RUNNER_TEMP/council-venv/bin/python" -m pytest -q source/services/council/tests
          "$RUNNER_TEMP/council-venv/bin/python" harness/scripts/craci/council-postgres.py



  new-products-browser:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'new-products-browser' }}
    name: New product ${{ matrix.product }} / ${{ matrix.browser }}
    runs-on: craci
    timeout-minutes: 20
    concurrency:
      group: craci-new-browser-${{ matrix.product }}-${{ matrix.browser }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        product: ${{ fromJSON(inputs.product == 'cala' && '["cala"]' || inputs.product == 'context' && '["context"]' || '["cala","context"]') }}
        browser: ${{ fromJSON(inputs.browser == 'chromium' && '["chromium"]' || inputs.browser == 'firefox' && '["firefox"]' || inputs.browser == 'webkit' && '["webkit"]' || '["chromium","firefox","webkit"]') }}
    env:
      PRODUCT_SOURCE_SHA: ${{ inputs.source_sha || fromJSON('{"cala":"ff6b0bacb1d796a098dba6798d61f59dc977420c","context":"76f0405ac49f2017129ec11d891c2a2cbe7d1838"}')[matrix.product] }}
    steps:
      - name: Configure monitored packages and bounded browser downloads
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '4'
          image: ubuntu-24.04
          network: |
            default: deny
            presets: [github, npm, ubuntu]
            sources:
              - apt:
                  urls: [https://packages.microsoft.com/ubuntu/24.04/prod]
            connections:
              - tls:
                  serverNamePatterns: [cdn.playwright.dev, playwright.download.prss.microsoft.com, storage.googleapis.com]
                  ports: [443]
      - name: Enforce credit window and exact product selection
        env:
          SELECTED_PRODUCT: ${{ inputs.product }}
          SOURCE_OVERRIDE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
          [[ "$PRODUCT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$SELECTED_PRODUCT" in cala|context|all) ;; *) exit 1;; esac
          if [ -n "$SOURCE_OVERRIDE" ]; then
            case "$SELECTED_PRODUCT" in cala|context) ;; *) exit 1;; esac
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked browser harness
        working-directory: harness
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps "$BROWSER"
      - name: Exercise actual local HTTP product journeys
        working-directory: harness
        env:
          CRACI_PRODUCT: ${{ matrix.product }}
          CRACI_BROWSER: ${{ matrix.browser }}
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: ${{ env.PRODUCT_SOURCE_SHA }}
        run: |
          set -euo pipefail
          export CRACI_BROWSER_OUTPUT="$RUNNER_TEMP/craci-new-product-results"
          node scripts/craci/new-products-browser.mjs

  native-probe:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'native-probe' }}
    name: Native product behavior / ${{ matrix.arch }}
    runs-on: craci
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x64
            image: default
          - arch: arm64
            image: craci-slim-arm
    env:
      PRODUCT_SOURCE_SHA: 'd0be3abf66c86d6817f82ca5ae5598ae003b5360'
    steps:
      - name: Select native runner architecture
        uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '2'
          image: ${{ matrix.image }}
          network: |
            default: deny
            presets: [github]
      - name: Enforce credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ env.PRODUCT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check independent expected answers and publish canonical digest
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: ${{ env.PRODUCT_SOURCE_SHA }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          git -C harness rev-parse HEAD
          node harness/scripts/craci/platform-probe.mjs native

  cache-cold:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'cache-proof' }}
    name: Monitored dependency cache / cold producer
    runs-on: craci
    timeout-minutes: 10
    outputs:
      cache_key: ${{ steps.key.outputs.key }}
      graph_sha: ${{ steps.probe.outputs.graph_sha }}
      lock_sha: ${{ steps.probe.outputs.lock_sha }}
      node_version: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '2'
          image: default
          network: |
            default: deny
            presets: [github, npm]
      - name: Enforce credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: '98d5a524d61e431ca36acd62b268ede343fc7fe2'
          persist-credentials: false
      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select one run-specific lockfile and architecture cache key
        id: key
        env:
          KEY: j26-craci-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('source/package-lock.json') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Prove the producer starts without a cache hit
        id: lookup
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/craci-npm-cache
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Install through monitored npm and fingerprint actual dependencies
        id: probe
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: '98d5a524d61e431ca36acd62b268ede343fc7fe2'
          CACHE_MODE: cold
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.key.outputs.key }}
          CRACI_NPM_CACHE: ${{ runner.temp }}/craci-npm-cache
        run: node harness/scripts/craci/platform-probe.mjs cache
      - name: Save exactly one monitored cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/craci-npm-cache
          key: ${{ steps.key.outputs.key }}

  cache-warm:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'cache-proof' }}
    needs: cache-cold
    name: Monitored dependency cache / warm offline consumer
    runs-on: craci
    timeout-minutes: 10
    steps:
      - uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
        with:
          size: '2'
          image: default
          network: |
            default: deny
            presets: [github]
      - name: Enforce credit window
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud "$CRACI_WINDOW_END" +%s)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: '98d5a524d61e431ca36acd62b268ede343fc7fe2'
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ needs.cache-cold.outputs.node_version }}
      - name: Require the exact producer cache
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/craci-npm-cache
          key: ${{ needs.cache-cold.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install offline and compare source validation and dependency graph
        env:
          SOURCE_DIR: ${{ github.workspace }}/source
          EXPECTED_SOURCE_SHA: '98d5a524d61e431ca36acd62b268ede343fc7fe2'
          CACHE_MODE: warm
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ needs.cache-cold.outputs.cache_key }}
          CRACI_NPM_CACHE: ${{ runner.temp }}/craci-npm-cache
          EXPECTED_CACHE_GRAPH_SHA: ${{ needs.cache-cold.outputs.graph_sha }}
          EXPECTED_CACHE_LOCK_SHA: ${{ needs.cache-cold.outputs.lock_sha }}
        run: node harness/scripts/craci/platform-probe.mjs cache

  mariadb-runtime:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && github.event_name == 'workflow_dispatch' && inputs.workload == 'mariadb-runtime' }}
