        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/mujoco-venv"
        "$RUNNER_TEMP/mujoco-venv/bin/python" -m pip install --only-binary=:all: 'numpy==2.3.4' 'mujoco==3.3.7'
        "$RUNNER_TEMP/mujoco-venv/bin/python" -c "import mujoco; assert mujoco.__version__ == '3.3.7'"

    - name: Train an observation-only corridor macro policy and evaluate fresh paired dev
      id: qualification
      run: |
        set -euo pipefail
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- python3 "$CRACI_HARNESS_ROOT/scripts/craci/rokoko-mujoco-v6-learning-qualification.py"

    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
