    env:
      PRODUCT_SOURCE_SHA: 'd0be3abf66c86d6817f82ca5ae5598ae003b5360'
      CRACI_MARIADB_IMAGE: mariadb@sha256:75b300c790eec33cd4386d80fc1a938e27604ba70f3eeda25e52874be2aae424
    steps:
