        "$RUNNER_TEMP/rokoko-rl-venv/bin/python" -m pip install --no-cache-dir --only-binary=:all: mujoco==3.3.7 numpy==2.4.6
        "$RUNNER_TEMP/rokoko-rl-venv/bin/python" -c 'import torch,mujoco,numpy; assert torch.__version__.startswith("2.9.1"); assert mujoco.__version__=="3.3.7"; assert numpy.__version__=="2.4.6"; assert not torch.cuda.is_available()'
