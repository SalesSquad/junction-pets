          presets: [github, ubuntu]
    - name: Enforce unchanged global credit deadline and bounded source
      shell: bash
      run: |
        set -euo pipefail
        test "$(( $(date -ud "$CRACI_WINDOW_END" +%s) - $(date -u +%s) ))" -gt 1260
        test "$CRACI_SOURCE_SHA" = "$CRACI_HARNESS_SHA"
        case "$CRACI_FEATURE_PROFILE" in all|color|spatial|gradient);; *) exit 2;; esac
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Checkout task-owned pinned training harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Checkout exact admitted public YCB-V numerical source fixture
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - name: Use pinned Node for receipts
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install R ML libraries from Ubuntu only
      shell: bash
      run: |
        set -euo pipefail
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        test -s "$ubuntu_sources"
        sudo apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get \
          -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- \
          install -qq -y --no-install-recommends r-base-core r-cran-rpart r-cran-nnet r-cran-jsonlite
        Rscript -e 'stopifnot(requireNamespace("rpart"),requireNamespace("nnet"),requireNamespace("jsonlite"))'
        Rscript -e 'invisible(parse(file=file.path(Sys.getenv("CRACI_HARNESS_ROOT"),"scripts/craci/lens-real-r-train.R")));cat("R_REAL_PARSE_OK\n")'
        test "$(git -C "$CRACI_SOURCE_ROOT" rev-parse HEAD)" = "$CRACI_SOURCE_SHA"
        test "$(git -C "$CRACI_HARNESS_ROOT" rev-parse HEAD)" = "$CRACI_HARNESS_SHA"
    - name: Fit real-pixel R classification and scene-heldout abstention
      id: qualification
      shell: bash
      run: |
        set -euo pipefail
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash -euo pipefail -c '
          scratch="$RUNNER_TEMP/lens-real-training"
          test ! -e "$scratch"
          mkdir "$scratch"
          src="$CRACI_SOURCE_ROOT/fixtures/lens-public-ycbv-20261114"
          python3 "$CRACI_HARNESS_ROOT/scripts/craci/lens-data-gate.py" \
            --register "$CRACI_SOURCE_ROOT/docs/CHIBI_LENS_DATA_SOURCE_REGISTER_20261114.json" \
            --source-id bop-ycbv-test-public-mit --fixture-dir "$src" \
            --out "$scratch/cloud-admission.json"
          test -s "$scratch/cloud-admission.json"
          Rscript "$CRACI_HARNESS_ROOT/scripts/craci/lens-real-r-train.R" \
            "$src/real-object-features.csv" "$src/admission.json" "$scratch/models" \
            "$CRACI_PUBLIC_IMAGE_ARCHIVE_SHA" "$CRACI_FEATURE_PROFILE"
          test -s "$scratch/models/training-report.json"
          test -s "$scratch/models/trained-models.rds"
          dest="$CRACI_RECEIPT_DIR/artifacts/lens-real"
          mkdir -p "$dest"
          cp "$scratch/cloud-admission.json" "$dest/cloud-admission.json"
          cp "$scratch/models/training-report.json" "$dest/training-report.json"
          ( cd "$scratch/models" && python3 -m zipfile -c "$dest/trained-models.zip" \
