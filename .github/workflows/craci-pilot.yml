    needs: plan
    name: "Chibi Lens R ${{ inputs.workload }} / cohort ${{ matrix.cohort }} / CPU 4"
    runs-on: craci
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.workload == 'meta-r-hardshift-2x' && 6 || 8 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    env:
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_WORKLOAD: ${{ inputs.workload }}
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
      CRACI_COHORT: ${{ matrix.cohort }}
    steps:
    - name: CRACI isolated 4-vCPU default-deny sandbox
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '4'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, ubuntu]
    - name: Enforce current credit window and source pin before allocating compute
      shell: bash
      run: |
        set -euo pipefail
        test "$(( $(date -ud "$CRACI_WINDOW_END" +%s) - $(date -u +%s) ))" -gt 1260
        [[ "$CRACI_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
        test "$CRACI_SOURCE_SHA" = '634f1e0e6cb2de46bcf0a783532d46c23f513d11'
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Checkout exact reviewed R training harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Checkout exact Chibi Lens trained baseline and generator
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - name: Pin Node 22 for existing source-bound receipt producer
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install R packages from authorized Ubuntu repository only
      shell: bash
      run: |
        set -euo pipefail
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        test -s "$ubuntu_sources"
        sudo apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get \
          -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts=- \
          install -qq -y --no-install-recommends r-base-core r-cran-rpart r-cran-jsonlite
        Rscript -e 'stopifnot(requireNamespace("rpart"),requireNamespace("jsonlite"))'
        Rscript -e 'invisible(parse(file=file.path(Sys.getenv("CRACI_HARNESS_ROOT"),"scripts/craci/meta-r-train.R")));cat("R_PARSE_OK\n")'
        test "$(git -C "$CRACI_SOURCE_ROOT" rev-parse HEAD)" = "$CRACI_SOURCE_SHA"
        test "$(git -C "$CRACI_HARNESS_ROOT" rev-parse HEAD)" = "$CRACI_HARNESS_SHA"
    - name: Generate source-bound cohort and train four R models
      id: qualification
      shell: bash
      run: |
        set -euo pipefail
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash -euo pipefail -c '
          scratch="$RUNNER_TEMP/meta-r-work"
          test ! -e "$scratch"
          mkdir "$scratch"
          if [ "$CRACI_WORKLOAD" = "meta-r-hardshift-2x" ]; then profile="hardshift24"; elif [ "$CRACI_WORKLOAD" = "meta-r-robust" ]; then profile="robust"; else profile="normal"; fi
          python3 "$CRACI_HARNESS_ROOT/scripts/craci/meta-r-generate.py" \
            --source-root "$CRACI_SOURCE_ROOT" \
            --profile "$profile" --cohort "$CRACI_COHORT" --out "$scratch/dataset.csv"
          Rscript "$CRACI_HARNESS_ROOT/scripts/craci/meta-r-train.R" \
            "$scratch/dataset.csv" "$scratch/models" "$CRACI_SOURCE_SHA"
          test -s "$scratch/dataset-receipt.json"
          test -s "$scratch/models/training-report.json"
          test -s "$scratch/models/trained-models.rds"
          dest="$CRACI_RECEIPT_DIR/artifacts/meta-r"
          mkdir -p "$dest"
          cp "$scratch/dataset-receipt.json" "$dest/dataset-receipt.json"
          cp "$scratch/models/training-report.json" "$dest/training-report.json"
          ( cd "$scratch" && python3 -m zipfile -c "$dest/training-evidence.zip" \
            dataset.csv dataset-receipt.json models/training-report.json models/trained-models.rds )
          test -s "$dest/training-evidence.zip"
          python3 -m zipfile -t "$dest/training-evidence.zip"
        '
    - id: receipt
      name: Finalize source-bound successful or explicitly incomplete evidence
      if: ${{ always() }}
      shell: bash
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if test -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs"; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          mkdir -p "$CRACI_RECEIPT_DIR/upload"
          printf '%s\n' '{"schemaVersion":1,"status":"incomplete","reason":"Pinned harness unavailable","actualCostEur":null}' > "$CRACI_RECEIPT_DIR/upload/infrastructure-receipt.json"
          printf 'upload_ready=true\n' >> "$GITHUB_OUTPUT"
          exit 1
        fi
    - name: Store each cohort’s non-sensitive model weights, inputs and metrics
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-meta-r-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false

