        node --test chaos/test/*.test.mjs
    - name: Verify exact-source kill-9 recovery and 10k unique ledger changes
      id: qualification
      run: |
        set -euo pipefail
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- node "$CRACI_HARNESS_ROOT/scripts/craci/valio-wal-qualification.mjs"

    - id: receipt
      name: Finalize source-bound result and existing registry record
      if: ${{ always() }}
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if [ -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" ]; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          # An absent harness cannot supply a registry-validated execution receipt.
          # Preserve only explicit infrastructure metadata; never claim source verification.
          python3 - <<'CRACI_INFRA'
        import json,os,pathlib
        env=os.environ
        out=pathlib.Path(env['CRACI_RECEIPT_DIR'])/'upload'
        out.mkdir(parents=True,exist_ok=False)
        receipt={'schemaVersion':1,'result':'incomplete','evidence':'infrastructure-only',
         'reason':'Pinned harness checkout unavailable; no qualification or registry import verified',
         'workload':env['CRACI_WORKLOAD'],'cell':env['CRACI_CELL'],
         'sourceRequested':env['CRACI_SOURCE_SHA'],'harnessRequested':env['CRACI_HARNESS_SHA'],
         'sourceVerified':False,'harnessVerified':False,'actualCostEur':None,
         'runId':env['GITHUB_RUN_ID'],'runAttempt':env['GITHUB_RUN_ATTEMPT']}
        with (out/'infrastructure-receipt.json').open('x') as file:json.dump(receipt,file,sort_keys=True)
        with open(env['GITHUB_OUTPUT'],'a') as file:file.write('upload_ready=true\n')
        CRACI_INFRA
          exit 1
        fi
    - name: Retain bounded evidence even after failure
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-${{ github.job }}-${{ env.CRACI_CELL }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false
    needs:
    - plan

  # Three-hour, explicit owner-authorized counterfactual supply-chain campaign.
  # All payloads are synthetic and benign; actual CRACI trace/SBOM is separate.
  immune-tournament:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'immune-tournament' }}
    needs: plan
    name: "Immune epoch ${{ matrix.epoch }} / cohort ${{ matrix.seed }}"
    runs-on: craci
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_WORKLOAD: immune-tournament
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
      CRACI_IMMUNE_STOP: '2026-11-14T18:00:00Z'
    steps:
    - name: CRACI package-aware locked network (4 vCPU)
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '4'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, npm]
    - name: Enforce three-hour cutoff, leave room for completion
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(( $(date -ud "$CRACI_IMMUNE_STOP" +%s) - $(date -u +%s) ))" -gt 960
        test "$(( $(date -ud "$CRACI_WINDOW_END" +%s) - $(date -u +%s) ))" -gt 960
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$CRACI_SOURCE_SHA" = "$CRACI_HARNESS_SHA"
    - name: Check out pinned harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out exact product source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - name: Install pinned Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Observe real CRACI package downloads and SBOM
      working-directory: source
      run: npm ci --ignore-scripts --no-audit
    - name: Probe denied outbound to neutral example.com, never exfiltrate
      id: egress
      shell: bash
      run: |
        set -euo pipefail
        set +e
        curl --fail --silent --head --max-time 8 https://example.com -o /dev/null
        rc=$?
        set -e
        printf '{"probe":"example.com","exitCode":%s,"claim":"transport failed; CRACI network trace required for policy attribution"}\n' "$rc" > "$CRACI_RECEIPT_DIR/artifacts/egress-probe.json"
        if [ "$rc" -eq 0 ]; then
          echo 'Unexpected egress success under deny-by-default policy'
          exit 1
        fi
    - name: Seeded adversarial provenance graph and bounded counterfactual repair
      id: qualification
      shell: bash
      run: |
        set -euo pipefail
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- node "$CRACI_HARNESS_ROOT/scripts/craci/immune-tournament.mjs" --epoch "${{ matrix.epoch }}" --seed "${{ matrix.seed }}" --cases 250000 --lockfile "$CRACI_SOURCE_ROOT/package-lock.json" --output "$CRACI_RECEIPT_DIR/artifacts/immune-${{ matrix.seed }}.json"
    - id: receipt
      name: Finalize bounded source-verified receipt even after failed assertions
      if: ${{ always() }}
      shell: bash
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if test -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs"; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          mkdir -p "$CRACI_RECEIPT_DIR/upload"
          printf '%s\n' '{"schemaVersion":1,"result":"incomplete","evidence":"infrastructure-only","reason":"Pinned harness unavailable","actualCostEur":null}' > "$CRACI_RECEIPT_DIR/upload/infrastructure-receipt.json"
          printf 'upload_ready=true\n' >> "$GITHUB_OUTPUT"
          exit 1
        fi
    - name: Save fixed receipts and bounded metrics
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-immune-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false

  chaos-lab:
    if: ${{ vars.CRACI_CREDIT_WINDOW_OPEN == 'true' && inputs.workload == 'chaos-lab' }}
    needs: plan
    name: "Chaos Lab / ${{ matrix.profile }} / seed ${{ matrix.seed }}"
    runs-on: craci
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CRACI_SOURCE_SHA: ${{ matrix.source_sha }}
      CRACI_HARNESS_SHA: ${{ github.sha }}
      CRACI_HARNESS_ROOT: ${{ github.workspace }}/harness
      CRACI_SOURCE_ROOT: ${{ github.workspace }}/source
      CRACI_SOURCE_REPOSITORY: SalesSquad/junction-pets
      CRACI_WORKLOAD: chaos-lab
      CRACI_CELL: ${{ matrix.cell }}
      CRACI_NEXT_OWNER: Portfolio PR Recovery
      CRACI_ALLOWED_SOURCE_CHANGES: '[]'
      CRACI_CHAOS_STOP: '2026-11-14T18:00:00Z'
      CHAOS_PROFILE: ${{ matrix.profile }}
      CHAOS_SEED: ${{ matrix.seed }}
    steps:
    - name: Configure monitored CRACI sandbox and default-deny networking
      uses: cracicorp/setup@5cbae507e2547dca6c402e413c645767fbae3534
      with:
        size: '2'
        image: ubuntu-24.04
        network: |
          default: deny
          presets: [github, npm]
    - name: Enforce bounded three-hour authorization before checkout
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/craci-evidence/artifacts"
        printf 'CRACI_RECEIPT_DIR=%s/craci-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        test "$(( $(date -ud "$CRACI_CHAOS_STOP" +%s) - $(date -u +%s) ))" -gt 960
        test "$(( $(date -ud "$CRACI_WINDOW_END" +%s) - $(date -u +%s) ))" -gt 960
        [[ "$CRACI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        test "$CRACI_SOURCE_SHA" = "$CRACI_HARNESS_SHA"
    - name: Check out exact immutable harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: harness
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check out exact immutable source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: source
        ref: ${{ matrix.source_sha }}
        persist-credentials: false
    - name: Pin Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Observe real CRACI-monitored npm resolution once per distinct wave
      if: ${{ matrix.profile == 'network' }}
      working-directory: source
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Four profiles of fault-injection hooks and real isolated probes
      id: qualification
      shell: bash
      run: |
        set -euo pipefail
        node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" run -- bash -euo pipefail -c '
          node "$CRACI_HARNESS_ROOT/scripts/craci/chaos-lab.mjs" \
            --seed "$CHAOS_SEED" --cases 25000 --profile "$CHAOS_PROFILE" \
            --output "$CRACI_RECEIPT_DIR/artifacts/chaos-$CHAOS_PROFILE.json"
          if [ "$CHAOS_PROFILE" = "network" ]; then
            node "$CRACI_HARNESS_ROOT/scripts/craci/chaos-probes.mjs" \
              --output "$CRACI_RECEIPT_DIR/artifacts/probes-$CHAOS_PROFILE.json"
          fi
          if [ "$CHAOS_PROFILE" = "evidence" ]; then
            node --test "$CRACI_HARNESS_ROOT/scripts/craci/chaos-tests.test.mjs"
            python3 "$CRACI_HARNESS_ROOT/scripts/craci/chaos-controller-test.py"
          fi
        '
    - name: Probe neutral external HTTP with curl fail-on-HTTP-error
      if: ${{ matrix.profile == 'network' }}
      shell: bash
      run: |
        set -euo pipefail
        set +e
        http_code=$(curl --fail --silent --show-error --head --max-time 8 \
          --write-out '%{http_code}' https://example.com -o /dev/null)
        rc=$?
        set -e
        [[ "$http_code" =~ ^[0-9]{3}$ ]]
        printf '{"probe":"https://example.com","exitCode":%s,"httpStatus":"%s","claim":"HTTP or transport failure observed; CRACI provider trace required for policy attribution"}\n' "$rc" "$http_code" > "$CRACI_RECEIPT_DIR/artifacts/egress-probe.json"
        if [ "$rc" -eq 0 ]; then
          echo 'Unexpected successful HTTP response under deny-by-default CRACI policy'
          exit 1
        fi
    - id: receipt
      name: Finalize source-bound receipt, including on assertion failure
      if: ${{ always() }}
      shell: bash
      env:
        CRACI_JOB_STATUS: ${{ job.status }}
        CRACI_STAGE_OUTCOME: ${{ steps.qualification.outcome }}
      run: |
        set -euo pipefail
        export CRACI_RECEIPT_DIR="$RUNNER_TEMP/craci-evidence"
        if test -f "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs"; then
          node "$CRACI_HARNESS_ROOT/scripts/craci/run-receipt.mjs" finalize
        else
          mkdir -p "$CRACI_RECEIPT_DIR/upload"
          printf '%s\n' '{"schemaVersion":1,"result":"incomplete","evidence":"infrastructure-only","reason":"Pinned harness unavailable","actualCostEur":null}' > "$CRACI_RECEIPT_DIR/upload/infrastructure-receipt.json"
          printf 'upload_ready=true\n' >> "$GITHUB_OUTPUT"
          exit 1
        fi
    - name: Upload compact immutable chaos evidence
      if: ${{ always() && steps.receipt.outputs.upload_ready == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: craci-chaos-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/craci-evidence/upload/
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
        overwrite: false
        include-hidden-files: false
