# Local Apple-silicon fallback (CUDA box unreachable). SYNTHETIC data; research artefact only.
# Batch 1 because a batch of 4 needed 16 GB (262k-token vocabulary logits) and pushed the Mac into swap.
model: mlx-community/gemma-3-1b-it-bf16
train: true
data: scribe/artifacts/mlx-data
fine_tune_type: lora
optimizer: adamw
seed: 20261114
num_layers: -1
batch_size: 1
grad_accumulation_steps: 4
iters: 1200           # upper bound; the run is stopped by a wall-clock cap and the last saved checkpoint is used
learning_rate: 1.0e-4 # constant, so that a wall-clock stop does not leave a half-finished schedule
steps_per_report: 10
steps_per_eval: 200
val_batches: 50
save_every: 50
max_seq_length: 768
mask_prompt: true
adapter_path: scribe/artifacts/adapter-v1
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
