<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 230" width="1152" height="230" role="img" aria-label="Exact match by system on the frozen synthetic stress set, all notes and notes with new phrasings"><defs><pattern id="hatchB" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2C6FAE" opacity="0.18"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2C6FAE" stroke-width="2.2"/></pattern></defs><text x="0" y="65" font-family="Seravek, 'Avenir Next', sans-serif" font-size="15" font-weight="600" fill="#13202A">Gemma 3 270M + Finnish code rule</text><text x="0" y="82" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862">arm A': model writes dates, a lexicon rule fixes relative ones</text><text x="0" y="109" font-family="Seravek, 'Avenir Next', sans-serif" font-size="15" font-weight="600" fill="#13202A">Gemma 3 270M, phrase only</text><text x="0" y="126" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862">arm B: model copies the phrase, code computes the date</text><text x="0" y="153" font-family="Seravek, 'Avenir Next', sans-serif" font-size="15" font-weight="600" fill="#13202A">Gemma 3 1B, phrase only</text><text x="0" y="170" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862">arm C: same method, larger model</text><text x="0" y="197" font-family="Seravek, 'Avenir Next', sans-serif" font-size="15" font-weight="600" fill="#13202A">Nemotron 3.5 Super VL</text><text x="0" y="214" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862">second reader; it also wrote these notes, so optimistic</text><text x="430" y="16" font-family="Seravek, 'Avenir Next', sans-serif" font-size="15" font-weight="700" fill="#13202A">All 308 stress notes</text><text x="430" y="34" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" fo