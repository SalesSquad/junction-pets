<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="Helsinki cervical screening participation when pre-booked appointment times were removed and returned"><path d="M64,87.30434782608697 L204,159.47826086956522 L344,87.30434782608697" fill="none" stroke="#2C6FAE" stroke-width="2.5" stroke-dasharray="0"/><circle cx="64" cy="87.30434782608697" r="7" fill="#2C6FAE" stroke="#fff" stroke-width="2"/><text x="64" y="73.30434782608697" font-family="'DIN Alternate', 'Avenir Next Condensed', sans-serif" font-size="20" font-weight="700" fill="#13202A" text-anchor="middle">72%</text><text x="64" y="242" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862" text-anchor="middle">Pre-booked time</text><circle cx="204" cy="159.47826086956522" r="7" fill="#B8213F" stroke="#fff" stroke-width="2"/><text x="204" y="187.47826086956522" font-family="'DIN Alternate', 'Avenir Next Condensed', sans-serif" font-size="20" font-weight="700" fill="#13202A" text-anchor="middle">about 62%</text><text x="204" y="242" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862" text-anchor="middle">Times removed</text><circle cx="344" cy="87.30434782608697" r="7" fill="#2C6FAE" stroke="#fff" stroke-width="2"/><text x="344" y="55.30434782608697" font-family="Seravek, 'Avenir Next', sans-serif" font-size="13.5" font-weight="700" fill="#13202A" text-anchor="middle">back to the</text><text x="344" y="73.30434782608697" font-family="Seravek, 'Avenir Next', sans-serif" font-size="13.5" font-weight="700" fill="#13202A" text-anchor="middle">original level</text><text x="344" y="242" font-family="Seravek, 'Avenir Next', sans-serif" font-size="12.5" font-weight="400" fill="#4A5862" text-anchor="middle">Times returned</text></svg>