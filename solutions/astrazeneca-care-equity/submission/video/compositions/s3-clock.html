<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
        }
        /* A: six weeks / six months / stage */
        .c-a {
          position: absolute;
          left: 96px;
          top: 140px;
          width: 1728px;
        }
        .c-row {
          margin-top: 30px;
        }
        .c-row .lbl {
          font-family: var(--sans);
          font-size: 30px;
          color: var(--ink);
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .c-track {
          position: relative;
          height: 64px;
          margin-top: 12px;
        }
        .c-fill {
          position: absolute;
          left: 0;
          top: 0;
          height: 64px;
          transform-origin: left center;
        }
        .c-val {
          position: absolute;
          top: 6px;
          font-family: var(--serif);
          font-size: 46px;
          line-height: 52px;
          font-weight: 700;
        }
        .c-either {
          margin-top: 40px;
          font-family: var(--serif);
          font-size: 58px;
          line-height: 1.1;
          color: var(--ink);
        }
        .c-stage {
          margin-top: 28px;
          display: grid;
          grid-template-columns: 330px 1fr;
          align-items: center;
          gap: 40px;
        }
        .c-big {
          font-family: var(--serif);
          font-size: 150px;
          line-height: 1;
          color: var(--amber);
          display: inline-block;
          transform-origin: left center;
        }
        .c-big small {
          font-size: 0.5em;
        }
        .c-meter-l {
          font-family: var(--sans);
          font-size: 30px;
          color: var(--ink);
          margin-bottom: 14px;
        }
        .c-meter {
          position: relative;
          width: 1300px;
          height: 46px;
          background: var(--wash);
          border: 2px solid var(--line);
        }
        .c-meter .c-fill {
          height: 42px;
          width: 546px;
          background: var(--amber);
        }
        .c-aim {
          position: absolute;
          left: 908px;
          top: -14px;
          width: 4px;
          height: 74px;
          background: var(--ink);
        }
        .c-aim span {
          position: absolute;
          left: 14px;
          top: 74px;
          white-space: nowrap;
          font-family: var(--mono);
          font-size: 20px;
          color: var(--ink);
        }
        /* B: two dates */
        .c-b {
          position: absolute;
          left: 96px;
          top: 150px;
          width: 1728px;
        }
        .c-b h2 {
          font-family: var(--serif);
          font-weight: 400;
          font-size: 76px;
          line-height: 1.08;
          margin-top: 22px;
          width: 1500px;
        }
        .c-flow {
          position: relative;
          margin-top: 80px;
          height: 300px;
        }
        .c-node {
          position: absolute;
          top: 0;
          width: 440px;
          border: 3px solid var(--teal);
          background: #fff;
          padding: 22px 26px;
        }
        .c-node b {
          display: block;
          font-family: var(--mono);
          font-size: 20px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--teal);
        }
        .c-node span {
          display: block;
          font-family: var(--serif);
          font-size: 46px;
          line-height: 1.1;
          margin-top: 8px;
        }
        .c-link {
          position: absolute;
          top: 64px;
          left: 440px;
          width: 560px;
          height: 6px;
          background: var(--teal);
          transform-origin: left center;
        }
        .c-link-l {
          position: absolute;
          top: 92px;
          left: 440px;
          width: 560px;
          text-align: center;
          font-family: var(--sans);
          font-size: 26px;
          color: var(--muted);
        }
        .c-node.end {
          border-color: var(--amber);
        }
        .c-node.end b {
          color: var(--amber);
        }
        /* C: FLARE gate */
        .c-c {
          position: absolute;
          inset: 0;
        }
        .c-grid {
          position: absolute;
          left: 96px;
          top: 226px;
          width: 852px;
          display: grid;
          grid-template-columns: repeat(6, 128px);
          gap: 16px;
        }
        .tile {
          position: relative;
          width: 128px;
          height: 104px;
          background: var(--wash);
          border: 2px solid var(--line);
        }
        .tile .lit {
          position: absolute;
          inset: -2px;
          background: var(--teal);
        }
        .tile .hatch {
          position: absolute;
          inset: -2px;
          border: 4px solid var(--amber);
          background: repeating-linear-gradient(135deg, #f3e7d6 0 10px, #fafaf6 10px 20px);
        }
        .tile .n {
          position: absolute;
          left: 12px;
          top: 10px;
          font-family: var(--mono);
          font-size: 20px;
          font-weight: 700;
          color: #fafaf6;
        }
        .tile .hatch .n2 {
          position: absolute;
          left: 10px;
          top: 6px;
          font-family: var(--mono);
          font-size: 20px;
          font-weight: 700;
          color: var(--amber);
        }
        .c-legend {
          position: absolute;
          left: 96px;
          top: 720px;
          width: 852px;
          display: flex;
          gap: 34px;
          font-family: var(--sans);
          font-size: 24px;
          color: var(--ink);
          align-items: center;
        }
        .sw {
          display: inline-block;
          width: 28px;
          height: 28px;
          vertical-align: -6px;
          margin-right: 10px;
        }
        .c-right {
          position: absolute;
          left: 1040px;
          top: 160px;
          width: 784px;
        }
        .c-right .lead {
          font-family: var(--serif);
          font-size: 46px;
          line-height: 1.15;
          margin-top: 24px;
        }
        .c-motto {
          font-family: var(--serif);
          font-size: 50px;
          line-height: 1.12;
          color: var(--teal);
          margin-top: 34px;
        }
        .c-state {
          position: relative;
          margin-top: 30px;
          height: 190px;
        }
        .c-st {
          position: absolute;
          left: 0;
          top: 0;
          width: 784px;
          border-top: 3px solid var(--ink);
          padding-top: 18px;
          display: grid;
          grid-template-columns: 170px 1fr;
          gap: 22px;
          align-items: center;
        }
        .c-st .k {
          font-family: var(--serif);
          font-size: 120px;
          line-height: 1;
        }
        .c-st .t {
          font-family: var(--sans);
          font-size: 30px;
          line-height: 1.25;
        }
        .c-st .t b {
          display: block;
          font-family: var(--mono);
          font-size: 20px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-bottom: 6px;
        }
      </style>

      <div id="root" data-composition-id="s3-clock" data-width="1920" data-height="1080">
        <!-- A -->
        <div class="part" id="s3-a">
          <div class="c-a">
            <div class="eyebrow" id="s3-a-eye">Suspected-cancer referral to treatment: how long?</div>
            <div class="c-row" id="s3-r1">
              <div class="lbl">Target reported by the OECD/EU <span class="chip ph">Reported, not law</span></div>
              <div class="c-track"><div class="c-fill" id="s3-f1" style="width: 254px; background: var(--teal)"></div><div class="c-val" id="s3-v1" style="left: 276px; color: var(--teal)">6 weeks</div></div>
            </div>
            <div class="c-row" id="s3-r2">
              <div class="lbl">Finnish law, treatment guarantee</div>
              <div class="c-track"><div class="c-fill" id="s3-f2" style="width: 1100px; background: var(--muted)"></div><div class="c-val" id="s3-v2" style="left: 1122px; color: var(--muted)">up to 6 months</div></div>
            </div>
            <div class="c-either" id="s3-either">No county can show whether it meets either.</div>
            <div class="c-stage" id="s3-stage">
              <div class="c-big" id="s3-big"><span id="s3-42">42</span><small>%</small></div>
              <div>
                <div class="c-meter-l">of cancers have their stage recorded, nationally</div>
                <div class="c-meter"><div class="c-fill" id="s3-mf"></div><div class="c-aim" id="s3-aim"><span>aim: at least 70%</span></div></div>
              </div>
            </div>
          </div>
          <div class="src" id="s3-a-src">
            Sources: submission/evidence-v2.json → oecd-2025-fi-six-weeks (OECD/EU-reported, not the law), stm-hoitotakuu
            (up to six months), syopajarjestot-2026-stage-completeness (42%, aim 70%). Bar lengths: 6 of 26 weeks.
          </div>
        </div>

        <!-- B -->
        <div class="part" id="s3-b">
          <div class="c-b">
            <div class="eyebrow">The minimum, for every county</div>
            <h2 id="s3-b-h">SAMA asks for two dates and an end reason per patient.</h2>
            <div class="c-flow">
              <div class="c-node" id="s3-n1" style="left: 0"><b>Date 1</b><span>Suspected-cancer referral sent</span></div>
              <div class="c-link" id="s3-link"></div>
              <div class="c-link-l" id="s3-link-l">the clock runs</div>
              <div class="c-node" id="s3-n2" style="left: 1000px"><b>Date 2</b><span>Treatment starts</span></div>
              <div class="c-node end" id="s3-n3" style="left: 1000px; top: 190px"><b>Or</b><span>An end reason</span></div>
            </div>
          </div>
        </div>

        <!-- C -->
        <div class="part c-c" id="s3-c">
          <div class="eyebrow" style="position: absolute; left: 96px; top: 150px" id="s3-c-eye">
            <span class="chip syn">Synthetic</span>&nbsp; 23 county sites · NVIDIA FLARE
          </div>
          <div class="c-grid" id="s3-grid"></div>
          <div class="c-legend" id="s3-legend">
            <span><i class="sw" style="background: var(--teal)"></i>computed where the data live</span>
            <span><i class="sw" style="background: repeating-linear-gradient(135deg, #f3e7d6 0 6px, #fafaf6 6px 12px); border: 3px solid var(--amber)"></i>not comparable</span>
          </div>
          <div class="c-right">
            <div class="eyebrow">Measure it only where it can be seen</div>
            <div class="lead" id="s3-lead">Each county computes its own clock on its own data. Only totals leave.</div>
            <div class="c-motto" id="s3-motto">A county is compared only when it can see itself.</div>
            <div class="c-state">
              <div class="c-st" id="s3-st1">
                <div class="k" style="color: var(--amber)">15</div>
                <div class="t"><b style="color: var(--amber)">of 23 not comparable</b>if the dates come from the model alone</div>
              </div>
              <div class="c-st" id="s3-st2">
                <div class="k" style="color: var(--teal)">1</div>
                <div class="t"><b style="color: var(--teal)">of 23 not comparable</b>when Gemma reads the note and code counts the days</div>
              </div>
            </div>
          </div>
          <div class="src" id="s3-c-src">
            SYNTHETIC data; thresholds are placeholders; FLARE 2.9.1 simulator, 23 sites on one Mac. data/flare/gate-v1.json:
            summary.raw 15 of 23, summary.resolver 1 of 23; FLARE output equals the central table in 253 of 253 cells.
          </div>
        </div>
      </div>

      <script>
        (function () {
          // data/flare/gate-v1.json counties[] order HVA01..HVA21, HVA90, HVA91
          const RAW_NC = [0, 2, 3, 4, 6, 7, 8, 12, 13, 14, 15, 16, 20, 21, 22]; // summary.raw.not_comparable_counties
          const RES_NC = [3]; // summary.resolver.not_comparable_counties (HVA04)
          const grid = document.getElementById("s3-grid");
          for (let i = 0; i < 23; i++) {
            const t = document.createElement("div");
            t.className = "tile";
            t.id = "s3-tile-" + i;
            const n = String(i + 1).padStart(2, "0");
            t.innerHTML =
              '<div class="lit" id="s3-lit-' + i + '"><span class="n">' + n + "</span></div>" +
              '<div class="hatch" id="s3-h-' + i + '"><span class="n2">' + n + "</span></div>";
            grid.appendChild(t);
          }

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // ---- A (0 - 15.0)
          tl.fromTo("#s3-a-eye", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.2);
          tl.fromTo("#s3-r1", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.4);
          tl.fromTo("#s3-f1", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.out" }, 0.7);
          tl.fromTo("#s3-v1", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.35 }, 1.4);
          tl.fromTo("#s3-r2", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.8);
          tl.fromTo("#s3-f2", { scaleX: 0 }, { scaleX: 1, duration: 2.0, ease: "power1.inOut" }, 5.0);
          tl.fromTo("#s3-v2", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.35 }, 6.8);
          tl.fromTo("#s3-a-src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 1.0);
          tl.fromTo("#s3-either", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.8);
          tl.fromTo("#s3-stage", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.6);
          const st = { v: 0 };
          tl.fromTo(st, { v: 0 }, { v: 42, duration: 1.3, ease: "power2.out", onUpdate: () => { document.getElementById("s3-42").textContent = Math.round(st.v); } }, 10.8);
          tl.fromTo("#s3-big", { scale: 0.75 }, { scale: 1, duration: 1.3, ease: "power2.out" }, 10.8);
          tl.fromTo("#s3-mf", { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power2.out" }, 10.8);
          tl.fromTo("#s3-aim", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 12.2);
          tl.to("#s3-a", { autoAlpha: 0, y: -30, duration: 0.4, ease: "power2.in" }, 14.75);

          // ---- B (15.15 - 19.6)
          tl.fromTo("#s3-b .eyebrow", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 15.15);
          tl.fromTo("#s3-b-h", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "expo.out" }, 15.2);
          tl.fromTo("#s3-n1", { autoAlpha: 0, scale: 0.85 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 15.8);
          tl.fromTo("#s3-link", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 16.2);
          tl.fromTo("#s3-link-l", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 16.6);
          tl.fromTo("#s3-n2", { autoAlpha: 0, scale: 0.85 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 17.1);
          tl.fromTo("#s3-n3", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 17.7);
          tl.to("#s3-b", { autoAlpha: 0, y: -30, duration: 0.35, ease: "power2.in" }, 19.3);

          // ---- C (19.7 - 29.5): FLARE sites light up, then the comparability gate
          tl.fromTo("#s3-c-eye", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 19.7);
          tl.fromTo("#s3-grid .tile", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)", stagger: 0.02 }, 19.8);
          tl.fromTo("#s3-c .eyebrow:not(#s3-c-eye), #s3-lead", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 20.0);
          // light up one by one: each site computes locally
          const litSel = [];
          for (let i = 0; i < 23; i++) litSel.push("#s3-lit-" + i);
          tl.fromTo(litSel.join(","), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.18, ease: "none", stagger: 0.12 }, 20.6);
          for (let i = 0; i < 23; i++) tl.set("#s3-h-" + i, { autoAlpha: 0 }, 0);
          tl.fromTo("#s3-legend", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 21.0);
          tl.fromTo("#s3-c-src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 20.4);
          tl.fromTo("#s3-motto", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 25.0);
          // state 1: model's own dates -> 15 of 23 not comparable
          tl.fromTo("#s3-st1", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 25.4);
          tl.fromTo(RAW_NC.map((i) => "#s3-h-" + i).join(","), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, stagger: 0.03, immediateRender: false }, 25.5);
          // state 2: Gemma reads, code counts -> 1 of 23
          tl.to("#s3-st1", { autoAlpha: 0, y: -20, duration: 0.3, ease: "power2.in" }, 27.3);
          tl.fromTo("#s3-st2", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.out" }, 27.55);
          tl.to(RAW_NC.filter((i) => !RES_NC.includes(i)).map((i) => "#s3-h-" + i).join(","), { autoAlpha: 0, duration: 0.25, stagger: 0.02 }, 27.6);
          tl.to("#s3-c", { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 29.15);

          window.__timelines["s3-clock"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
