[project]
name = "sama-eventlog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "pyarrow==26.0.1", "scipy==1.18.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eventlog"]
package-dir = {eventlog = "."}
