{
  "openapi": "3.1.0",
  "info": {
    "title": "Trusted Trade — implemented SYNTHETIC localhost API",
    "version": "0.7.0",
    "description": "All parties, stock, prices, approvals, emission factors, orders, scan GTINs and EUR wallet balances invented. Default product discovery is lexical, NOT pgvector. Optional pgvector adapter requires a real separate database and embedding provider. No banking, brokerage or commercial effects. Scanner observations are not physical receipt attestation. Independent Ed25519 proof-of-possession demo keys are self-attested, not verified identities, Kättely or AP2 certification."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/.well-known/trusted-trade": {
      "get": {
        "summary": "Discover synthetic capabilities",
        "responses": {
          "200": {
            "description": "Synthetic result only"
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/.well-known/trusted-trade/jwks.json": {
      "get": {
        "summary": "Publish ephemeral self-attested demo verification keys, NOT a trusted identity registry",
        "responses": {
          "200": {
            "description": "Synthetic result only"
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/demo/session": {
      "post": {
        "summary": "Issue an ephemeral demo buyer capability (not login)",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "buyerId"
                ],
                "properties": {
                  "buyerId": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "token",
                    "buyerId",
                    "mode"
                  ],
                  "properties": {
                    "token": {
                      "type": "string"
                    },
                    "buyerId": {
                      "type": "string"
                    },
                    "mode": {
                      "const": "SYNTHETIC_NOT_AUTHENTICATED"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/catalog": {
      "get": {
        "summary": "Read current synthetic product prices, stock and versions",
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "mode",
                    "products"
                  ],
                  "properties": {
                    "mode": {
                      "const": "INVENTED_FIXTURE"
                    },
                    "products": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Product"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/products/search": {
      "get": {
        "summary": "Read-only buyer-scoped product candidate discovery (fixture lexical by default; optional PostgreSQL/pgvector provider)",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 2,
              "maxLength": 160
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Advisory candidates with source digests; never commercial truth",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "query",
                    "mode",
                    "candidates",
                    "reason",
                    "requiresTradeCoreValidation"
                  ],
                  "properties": {
                    "query": {
                      "type": "string"
                    },
                    "mode": {
                      "enum": [
                        "FIXTURE_LEXICAL_NO_EMBEDDINGS",
                        "PGVECTOR_HYBRID_RRF"
                      ]
                    },
                    "candidates": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "sku",
                          "name",
                          "provenance",
                          "requiresTradeCoreValidation"
                        ],
                        "properties": {
                          "sku": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "family": {
                            "type": "string"
                          },
                          "lexicalScore": {
                            "type": "number"
                          },
                          "rrfScore": {
                            "type": "number"
                          },
                          "provenance": {
                            "type": "object",
                            "required": [
                              "sourceKind",
                              "sourceRef",
                              "sourceVersion",
                              "sourceSha256"
                            ],
                            "properties": {
                              "sourceKind": {
                                "type": "string"
                              },
                              "sourceRef": {
                                "type": "string"
                              },
                              "sourceVersion": {
                                "type": [
                                  "string",
                                  "integer"
                                ]
                              },
                              "sourceSha256": {
                                "type": "string"
                              },
                              "observedAt": {
                                "type": [
                                  "string",
                                  "null"
                                ],
                                "format": "date-time"
                              }
                            }
                          },
                          "requiresTradeCoreValidation": {
                            "const": true
                          }
                        }
                      }
                    },
                    "reason": {
                      "enum": [
                        "RANKED_ADVISORY_CANDIDATES",
                        "NO_SUPPORTED_MATCH",
                        "EXACT_GTIN_ROUTE_REQUIRED",
                        "UNVERIFIED_DIETARY_CONSTRAINT",
                        "LOW_CONFIDENCE_ABSTAINED"
                      ]
                    },
                    "requiresTradeCoreValidation": {
                      "const": true
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid query"
          },
          "403": {
            "description": "Demo session required"
          },
          "503": {
            "description": "Configured search backend unavailable"
          }
        }
      }
    },
    "/api/scan/resolve": {
      "get": {
        "summary": "Resolve a checksum-valid barcode by exact synthetic GTIN; never semantic identity",
        "parameters": [
          {
            "name": "gtin",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Exact synthetic product identity, never authority",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "product"
                  ],
                  "properties": {
                    "product": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "gtin",
                        "sku",
                        "name",
                        "family",
                        "unitsAvailable",
                        "priceCents",
                        "stockVersion",
                        "mode",
                        "observation",
                        "authority"
                      ],
                      "properties": {
                        "gtin": {
                          "type": "string"
                        },
                        "sku": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "family": {
                          "type": "string"
                        },
                        "unitsAvailable": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "priceCents": {
                          "type": "integer",
                          "minimum": 1
                        },
                        "stockVersion": {
                          "type": "integer",
                          "minimum": 1
                        },
                        "mode": {
                          "const": "INVENTED_FIXTURE_EXACT_GTIN"
                        },
                        "observation": {
                          "const": "CHECK_DIGIT_AND_EXACT_CATALOG_MATCH_ONLY"
                        },
                        "authority": {
                          "const": "NONE_SCAN_CANNOT_AUTHORIZE_TRADE"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid barcode or checksum"
          },
          "404": {
            "description": "Unknown barcode"
          }
        }
      }
    },
    "/api/scan/ocr": {
      "post": {
        "summary": "OPTIONAL demo-server Tesseract image OCR. No image storage; text is untrusted until user confirms.",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "image/png": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/jpeg": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OCR text and advisory typed recipe candidates; never an order or approval",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "text",
                    "candidates",
                    "duplicateFamilies",
                    "rawExcerpt",
                    "evidence",
                    "warning",
                    "mode",
                    "persistence",
                    "requiresHumanConfirmation"
                  ],
                  "properties": {
                    "text": {
                      "type": "string"
                    },
                    "candidates": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "required": [
                          "family",
                          "quantityLitres",
                          "lactoseFree",
                          "sourceLine",
                          "requiresHumanReview"
                        ],
                        "properties": {
                          "family": {
                            "type": "string"
                          },
                          "quantityLitres": {
                            "type": "integer",
                            "minimum": 1
                          },
                          "lactoseFree": {
                            "type": "boolean"
                          },
                          "sourceLine": {
                            "type": "string"
                          },
                          "requiresHumanReview": {
                            "const": true
                          }
                        }
                      }
                    },
                    "duplicateFamilies": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "rawExcerpt": {
                      "type": "string"
                    },
                    "evidence": {
                      "const": "OCR_TEXT_UNTRUSTED_REQUIRES_USER_REVIEW"
                    },
                    "warning": {
                      "type": "string"
                    },
                    "mode": {
                      "const": "LOCAL_TESSERACT_OCR_UNTRUSTED"
                    },
                    "persistence": {
                      "const": "IMAGE_NOT_STORED"
                    },
                    "requiresHumanConfirmation": {
                      "const": true
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Session required"
          },
          "408": {
            "description": "Image upload deadline exceeded"
          },
          "413": {
            "description": "Image too large"
          },
          "503": {
            "description": "Local OCR unavailable or busy"
          }
        }
      }
    },
