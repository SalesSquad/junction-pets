openapi: 3.1.0
info:
  title: Trusted Trade supplier interchange — PROPOSED, UNVERIFIED
  version: 0.1.0-draft
  description: >-
    Vendor-neutral API contract proposed for future procurement sandbox coordination.
    This is NOT a verified Valio Aimo API. The running localhost demo has an
    independent /api/** buyer-controlled fixture contract. No live order is placed.
servers:
  - url: https://supplier.example.invalid
    description: Non-routable example origin; replace only after supplier confirmation.
security:
  - supplierOAuth: [catalog:read]
paths:
  /v1/products:
    get:
      summary: Discover verified fixed-price catalog offers and availability.
      operationId: searchSupplierProducts
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: deliverBy
          schema: { type: string, format: date }
      responses:
        '200':
          description: Origin-backed catalog and availability.
          content:
            application/json:
              schema:
                type: object
                required: [products, sourceAt]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  sourceAt: { type: string, format: date-time }
  /v1/quotes:
    post:
      summary: Obtain a fixed-price and stock-checked, expiry-bound quote.
      operationId: requestSupplierQuote
      security:
        - supplierOAuth: [quote:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyerRef, requestedLines, deliveryDate, maximumTotalCents]
              properties:
                buyerRef: { type: string, minLength: 1 }
                deliveryDate: { type: string, format: date }
                maximumTotalCents: { type: integer, minimum: 1 }
                requestedLines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string }
                      quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Version-locked quote. The supplier must specify what is reserved versus merely checked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409':
          description: Stock, delivery deadline or price cannot be guaranteed.
  /v1/orders:
    post:
      summary: Submit a separately authorized and idempotent order.
      operationId: submitSupplierOrder
      description: >-
        DESIGN-ONLY endpoint, NEVER called by the demo. Production use requires
        authenticated buyer approval, quote version revalidation, supplier
        idempotency and signed evidence. No prototype browser action invokes it.
      security:
        - supplierOAuth: [order:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 10, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, quoteVersion, approvedBuyerPrincipal, authorizationReceipt]
              properties:
                quoteId: { type: string }
                quoteVersion: { type: string }
                approvedBuyerPrincipal: { type: string }
                authorizationReceipt: { type: string, description: 'Verified authorization reference, never an arbitrary browser label.' }
      responses:
        '201':
          description: Durable order receipt; replaying the same key returns the same order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403':
          description: Insufficient buyer authority or revoked approval.
        '409':
          description: Quote expired, source changed, stock changed or idempotency conflict.
components:
  securitySchemes:
    supplierOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://supplier.example.invalid/oauth/token
          scopes:
            catalog:read: Read catalog facts.
            quote:write: Request seller-backed quotes, not commit orders.
            order:write: Submit an authorized purchase; disabled in the demo.
  schemas:
    Product:
      type: object
      required: [sku, name, priceCents, availableUnits, sourceVersion, currency]
      properties:
        sku: { type: string }
        name: { type: string }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, const: EUR }
        availableUnits: { type: integer, minimum: 0 }
        sourceVersion: { type: string }
        earliestDelivery: { type: string, format: date }
        provenanceReceipt: { type: string }
    Quote:
      type: object
      required: [id, version, totalCents, currency, expiresAt, lines]
      properties:
        id: { type: string }
        version: { type: string }
        totalCents: { type: integer, minimum: 0 }
        currency: { type: string, const: EUR }
        expiresAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [sku, quantity, unitPriceCents, sourceVersion]
            properties:
              sku: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitPriceCents: { type: integer, minimum: 0 }
              sourceVersion: { type: string }
    Order:
      type: object
      required: [id, quoteId, status, totalCents, idempotencyReceipt]
      properties:
        id: { type: string }
        quoteId: { type: string }
        status: { type: string, enum: [accepted, rejected, cancelled, fulfilled] }
        totalCents: { type: integer, minimum: 0 }
        idempotencyReceipt: { type: string }
