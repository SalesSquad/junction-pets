{
  "openapi": "3.1.0",
  "info": {
    "title": "Trusted Trade — implemented SYNTHETIC localhost API",
    "version": "0.3.0",
    "description": "All parties, stock, prices, approvals and orders invented. No commercial effects. Demo capabilities are not verified identities."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/.well-known/trusted-trade": {
      "get": {
        "summary": "Discover synthetic capabilities",
        "responses": {
          "200": {
            "description": "Synthetic result only"
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/demo/session": {
      "post": {
        "summary": "Issue an ephemeral demo buyer capability (not login)",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "buyerId"
                ],
                "properties": {
                  "buyerId": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "token",
                    "buyerId",
                    "mode"
                  ],
                  "properties": {
                    "token": {
                      "type": "string"
                    },
                    "buyerId": {
                      "type": "string"
                    },
                    "mode": {
                      "const": "SYNTHETIC_NOT_AUTHENTICATED"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/catalog": {
      "get": {
        "summary": "Read current synthetic product prices, stock and versions",
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "mode",
                    "products"
                  ],
                  "properties": {
                    "mode": {
                      "const": "INVENTED_FIXTURE"
                    },
                    "products": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Product"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/policy": {
      "get": {
        "summary": "Read server-owned demo budget and approval threshold",
        "responses": {
          "200": {
            "description": "Synthetic result only"
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/quotes": {
      "post": {
        "summary": "Fix price and check availability; no reservation",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/QuoteRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "quote"
                  ],
                  "properties": {
                    "quote": {
                      "$ref": "#/components/schemas/Quote"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/reviews": {
      "post": {
        "summary": "Diagnose and propose a fixed quote from one coherent synthetic source snapshot; creates no approval",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/QuoteRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "review",
                    "quote"
                  ],
                  "properties": {
                    "review": {
                      "$ref": "#/components/schemas/ProcurementReview"
                    },
                    "quote": {
                      "oneOf": [
                        {
                          "$ref": "#/components/schemas/Quote"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/reviews/{id}/decision": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "summary": "Decide the exact displayed quote/snapshot; any budget exception applies only to that quote",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReviewDecision"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "review",
                    "quote"
                  ],
                  "properties": {
                    "review": {
                      "$ref": "#/components/schemas/ProcurementReview"
                    },
                    "quote": {
                      "oneOf": [
                        {
                          "$ref": "#/components/schemas/Quote"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/quotes/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "Read original quote terms",
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "quote"
                  ],
                  "properties": {
                    "quote": {
                      "$ref": "#/components/schemas/Quote"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/quotes/{id}/approval": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "summary": "Explicit unauthenticated synthetic human decision",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "buyerId",
                  "decision"
                ],
                "properties": {
                  "buyerId": {
                    "type": "string"
                  },
                  "decision": {
                    "enum": [
                      "approve",
                      "reject"
                    ]
                  },
                  "approver": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "quote"
                  ],
                  "properties": {
                    "quote": {
                      "$ref": "#/components/schemas/Quote"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/quotes/{id}/body": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "Export UNSIGNED Kättely-compatible quote BODY, not a signed receipt",
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "mode",
                    "signature",
                    "body"
                  ],
                  "properties": {
                    "mode": {
                      "const": "SYNTHETIC"
                    },
                    "signature": {
                      "const": "UNSIGNED"
                    },
                    "body": {
                      "$ref": "#/components/schemas/UnsignedQuoteBody"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/orders": {
      "post": {
        "summary": "Revalidate and commit exactly one simulated order",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "quoteId",
                  "buyerId",
                  "idempotencyKey"
                ],
                "properties": {
                  "quoteId": {
                    "type": "string"
                  },
                  "buyerId": {
                    "type": "string"
                  },
                  "idempotencyKey": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_-]{10,80}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "order"
                  ],
                  "properties": {
                    "order": {
                      "$ref": "#/components/schemas/Order"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/orders/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "summary": "Read simulated receipt",
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "order"
                  ],
                  "properties": {
                    "order": {
                      "$ref": "#/components/schemas/Order"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/orders/{id}/cancel": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "summary": "Cancel and restock once",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "buyerId"
                ],
                "properties": {
                  "buyerId": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Synthetic result only",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "order"
                  ],
                  "properties": {
                    "order": {
                      "$ref": "#/components/schemas/Order"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/audit": {
      "get": {
        "summary": "Read append-only in-memory demo events",
        "responses": {
          "200": {
            "description": "Synthetic result only"
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    },
    "/api/demo/reprice": {
      "post": {
        "summary": "Demo-only mutation; invalidates old source versions",
        "security": [
          {
            "demoCapability": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "sku",
                  "priceCents"
                ],
                "properties": {
                  "sku": {
                    "type": "string"
                  },
                  "priceCents": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100000
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Synthetic result only"
          },
          "400": {
            "description": "Invalid terms"
          },
          "403": {
            "description": "Buyer capability or approval refused"
          },
          "409": {
            "description": "Budget, stock, expiry, state or replay conflict"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "demoCapability": {
        "type": "http",
        "scheme": "bearer",
        "description": "Synthetic session capability only; NOT OAuth or real buyer identity."
      }
    },
    "schemas": {
      "UnsignedQuoteBody": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "quote_id",
          "supplier_id",
          "buyer_id",
          "audience",
          "currency",
          "issued_at",
          "expires_at",
          "lines",
          "total_cents"
        ],
        "properties": {
          "version": {
            "const": "kattely.procurement.quote.v1"
          },
          "quote_id": {
            "type": "string"
          },
          "supplier_id": {
            "const": "supplier-demo"
          },
          "buyer_id": {
            "type": "string"
          },
          "audience": {
            "const": "https://supplier-demo.invalid"
          },
          "currency": {
            "const": "EUR"
          },
          "issued_at": {
            "type": "integer"
          },
          "expires_at": {
            "type": "integer"
          },
          "lines": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "sku",
                "quantity",
                "unit",
                "unit_price_cents",
                "stock_version"
              ],
              "properties": {
                "sku": {
                  "type": "string"
                },
                "quantity": {
                  "type": "integer",
                  "minimum": 1
                },
                "unit": {
                  "const": "L"
                },
                "unit_price_cents": {
                  "type": "integer",
                  "minimum": 1
                },
                "stock_version": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            }
          },
          "total_cents": {
            "type": "integer",
            "minimum": 1,
            "description": "Sum of quantity * unit_price_cents; all values synthetic net cents."
          }
        }
      },
      "Product": {
        "type": "object",
        "required": [
          "sku",
          "family",
          "lactoseFree",
          "unitsAvailable",
          "priceCents",
          "version",
          "deliverBy"
        ],
        "properties": {
          "sku": {
            "type": "string"
          },
          "family": {
            "enum": [
              "dairy-milk",
              "oat-drink"
            ]
          },
          "lactoseFree": {
            "type": "boolean"
          },
          "unitsAvailable": {
            "type": "integer",
            "minimum": 0
          },
          "priceCents": {
            "type": "integer",
            "minimum": 1
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "deliverBy": {
            "type": "string",
            "format": "date"
          }
        }
      },
      "Quote": {
        "type": "object",
        "required": [
          "id",
          "buyerId",
          "lines",
          "totalCents",
          "approvalRequired",
          "status",
          "createdAtMs",
          "expiresAtMs",
          "explanation",
          "snapshotId",
          "sourceSnapshot",
          "reviewId",
          "budgetCents",
          "budgetException"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "buyerId": {
            "type": "string"
          },
          "totalCents": {
            "type": "integer",
            "minimum": 1
          },
          "approvalRequired": {
            "type": "boolean"
          },
          "status": {
            "type": "string"
          },
          "createdAtMs": {
            "type": "integer"
          },
          "expiresAtMs": {
            "type": "integer"
          },
          "explanation": {
            "type": "string"
          },
          "lines": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "sku",
                "name",
                "quantityLitres",
                "unitPriceCents",
                "totalCents",
                "stockVersion",
                "certification",
                "deliverBy"
              ],
              "properties": {
                "sku": {
                  "type": "string"
                },
                "name": {
                  "type": "string"
                },
                "quantityLitres": {
                  "type": "integer",
                  "minimum": 1
                },
                "unitPriceCents": {
                  "type": "integer",
                  "minimum": 1
                },
                "totalCents": {
                  "type": "integer",
                  "minimum": 1
                },
                "stockVersion": {
                  "type": "integer",
                  "minimum": 1
                },
                "certification": {
                  "type": "string"
                },
                "deliverBy": {
                  "type": "string"
                }
              }
            }
          },
          "snapshotId": {
            "type": "string"
          },
          "sourceSnapshot": {
            "$ref": "#/components/schemas/SourceSnapshot"
          },
          "reviewId": {
            "type": [
              "string",
              "null"
            ]
          },
          "budgetCents": {
            "type": "integer",
            "minimum": 1
          },
          "budgetException": {
            "oneOf": [
              {
                "type": "null"
              },
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "originalBudgetCents",
                  "proposedBudgetCents",
                  "additionalCents",
                  "scope"
                ],
                "properties": {
                  "originalBudgetCents": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "proposedBudgetCents": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "additionalCents": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "scope": {
                    "const": "THIS_QUOTE_ONLY"
                  }
                }
              }
            ]
          }
        }
      },
      "Order": {
        "type": "object",
        "required": [
          "id",
          "buyerId",
          "quoteId",
          "status",
          "totalCents",
          "commitment"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "buyerId": {
            "type": "string"
          },
          "quoteId": {
            "type": "string"
          },
          "status": {
            "enum": [
              "SIMULATED_COMMITTED",
              "SIMULATED_CANCELLED"
            ]
          },
          "totalCents": {
            "type": "integer",
            "minimum": 1
          },
          "commitment": {
            "const": "SIMULATION_ONLY_NO_REAL_PURCHASE"
          },
          "idempotentReplay": {
            "type": "boolean"
          }
        }
      },
      "BuyingNeed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "family",
          "quantityLitres",
          "lactoseFree",
          "deliverBy"
        ],
        "properties": {
          "family": {
            "enum": [
              "dairy-milk",
              "oat-drink"
            ]
          },
          "quantityLitres": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "lactoseFree": {
            "type": "boolean"
          },
          "deliverBy": {
            "const": "2026-11-16"
          }
        }
      },
      "ReviewDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "buyerId",
          "decision",
          "snapshotId",
          "quoteId"
        ],
        "properties": {
          "buyerId": {
            "type": "string"
          },
          "decision": {
            "enum": [
              "approve",
              "reject"
            ]
          },
          "snapshotId": {
            "type": "string"
          },
          "quoteId": {
            "type": "string"
          }
        }
      },
      "SourceSnapshot": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "observedAtMs",
          "mode",
          "stockReserved",
          "products",
          "policy",
          "constraints"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "observedAtMs": {
            "type": "integer"
          },
          "mode": {
            "const": "INVENTED_FIXTURE"
          },
          "stockReserved": {
            "const": false
          },
          "products": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Product"
            }
          },
          "policy": {
            "type": "object"
          },
          "constraints": {
            "$ref": "#/components/schemas/BuyingNeed"
          }
        }
      },
      "ProcurementReview": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "buyerId",
          "snapshotId",
          "sourceSnapshot",
          "requested",
          "originalBudgetCents",
          "diagnosis",
          "quoteId",
          "status",
          "expiresAtMs"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "buyerId": {
            "type": "string"
          },
          "snapshotId": {
            "type": "string"
          },
          "sourceSnapshot": {
            "$ref": "#/components/schemas/SourceSnapshot"
          },
          "requested": {
            "$ref": "#/components/schemas/BuyingNeed"
          },
          "originalBudgetCents": {
            "type": "integer",
            "minimum": 1
          },
          "diagnosis": {
            "type": "object",
            "required": [
              "outcome",
              "minimumCostCents",
              "additionalBudgetCents",
              "missingLitres",
              "sourceVersions"
            ],
            "properties": {
              "outcome": {
                "enum": [
                  "FEASIBLE_AT_SNAPSHOT",
                  "BUDGET_REVIEW_NEEDED",
                  "POLICY_LIMIT_EXCEEDED",
                  "STOCK_SHORTFALL"
                ]
              }
            }
          },
          "quoteId": {
            "type": [
              "string",
              "null"
            ]
          },
          "status": {
            "type": "string"
          },
          "expiresAtMs": {
            "type": "integer"
          }
        }
      },
      "QuoteRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "buyerId"
        ],
        "properties": {
          "buyerId": {
            "type": "string"
          },
          "need": {
            "$ref": "#/components/schemas/BuyingNeed"
          },
          "requestText": {
            "type": "string"
          },
          "budgetCents": {
            "type": "integer",
            "minimum": 1,
            "maximum": 250000
          }
        },
        "oneOf": [
          {
            "required": [
              "need"
            ],
            "not": {
              "required": [
                "requestText"
              ]
            }
          },
          {
            "required": [
              "requestText"
            ],
            "not": {
              "required": [
                "need"
              ]
            }
          }
        ]
      }
    }
  }
}
