                  "type": "integer",
                  "minimum": 1
                },
                "stock_version": {
                  "type": "integer",
                  "minimum": 1
                },
                "supplier_id": {
                  "type": "string"
                },
                "pack_litres": {
                  "type": "integer",
                  "minimum": 1
                },
                "pack_count": {
                  "type": "integer",
                  "minimum": 1
                },
                "min_order_packs": {
                  "type": "integer",
                  "minimum": 1
                }
